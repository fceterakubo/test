<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くまうさ もぐもぐライン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: full-screen canvas garden (belt across the top, animals in boxes on a wooden counter) under an HTML HUD. One bright pastel look on purpose. */
:root {
  --yellow: #FFD54A;
  --pink: #FF6FA0;
  --blue: #2F86E0;
  --green: #4EBE55;
  --orange: #FF9A1F;
  --brown: #5A3A28;
  --white: #FFFFFF;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif;
  --body: "Zen Maru Gothic", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: #BFE6FF; color: var(--brown); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#stage { position: relative; height: 100%; overflow: hidden; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

/* HUD */
.hud { position: absolute; inset: 0 0 auto 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 16px; pointer-events: none; }
.hud-left { display: grid; gap: 6px; justify-items: start; }
.score-pill {
  display: flex; align-items: center; gap: 8px; padding: 4px 18px 4px 8px; border-radius: 999px;
  background: linear-gradient(#5DB8FF, #2A7FE0); border: 3px solid var(--white);
  box-shadow: 0 4px 0 #1C5FB0, 0 8px 16px rgba(28, 95, 176, .25); color: var(--white);
}
.score-pill svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 2px 0 rgba(150, 90, 0, .35)); }
.score-pill .lbl { display: block; font: 800 11px/1 var(--display); letter-spacing: .12em; opacity: .95; }
.score-pill b { display: block; font: 800 28px/1.05 var(--display); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #1C5FB0; min-width: 1.4em; }
.combo-chip {
  font: 800 13px/1 var(--display); color: var(--brown); background: var(--yellow); border: 2px solid var(--white);
  border-radius: 999px; padding: 5px 10px; box-shadow: 0 3px 0 #E0A800;
}
.title-banner {
  position: relative; margin-top: 2px; background: var(--white); border-radius: 999px; padding: 6px 26px 8px; text-align: center;
  box-shadow: 0 4px 0 rgba(47, 134, 224, .18), 0 10px 22px rgba(47, 134, 224, .15); font-family: var(--display); font-weight: 800; line-height: 1.25;
}
.title-banner::before, .title-banner::after { content: ""; position: absolute; background: var(--white); border-radius: 50%; z-index: -1; }
.title-banner::before { width: 54px; height: 40px; left: 22px; top: -12px; }
.title-banner::after { width: 64px; height: 46px; right: 40px; top: -16px; }
.title-banner .l1 { font-size: 22px; color: var(--brown); }
.title-banner .l2 { font-size: 15px; color: var(--blue); letter-spacing: .04em; }
.o { color: var(--orange); }
.p { color: var(--pink); }
.hud-right { display: flex; align-items: center; gap: 10px; }
.lives-pill, .mode-pill {
  display: flex; align-items: center; gap: 4px; background: var(--white); border-radius: 999px; padding: 6px 12px;
  border: 3px solid #FFE1EC; box-shadow: 0 4px 0 rgba(255, 111, 160, .25);
}
.lives-pill svg { width: 28px; height: 26px; transition: transform .2s; }
.lives-pill svg.lost { transform: scale(.85); }
.mode-pill { font: 800 14px/1 var(--display); color: var(--green); padding: 9px 14px; border-color: #DDF3DE; box-shadow: 0 4px 0 rgba(78, 190, 85, .25); }
.round-btn {
  pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--white); cursor: pointer; padding: 0;
  background: linear-gradient(#FFCF55, #FF9F1C); box-shadow: 0 4px 0 #D9770A, 0 8px 14px rgba(217, 119, 10, .3);
  display: grid; place-items: center;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #D9770A; }
.round-btn:focus-visible, .btn:focus-visible, .text-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
@media (max-width: 759px) { .title-banner { display: none; } }

/* message banner */
.banner {
  position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); pointer-events: none;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--white); border-radius: 999px; padding: 10px 26px; font: 800 26px var(--display); color: var(--blue);
  box-shadow: 0 5px 0 rgba(47, 134, 224, .2), 0 14px 30px rgba(47, 134, 224, .2);
}
.banner svg { width: 30px; height: 30px; }
.banner.show { animation: pop 1.5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(.95); }
}

/* overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(110, 180, 240, .35); backdrop-filter: blur(3px); }
.card {
  width: 100%; max-width: 380px; background: var(--white); border-radius: 30px; border: 4px solid #CFEAFF;
  padding: 24px 22px 20px; text-align: center; box-shadow: 0 8px 0 rgba(47, 134, 224, .18), 0 24px 50px rgba(30, 80, 140, .2);
  max-height: calc(100% - 8px); overflow-y: auto;
}
.card h1, .card h2 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.3; text-wrap: balance; }
.card h1 { font-size: 26px; }
.card h1 small { display: block; font-size: 14px; color: var(--blue); letter-spacing: .06em; margin-bottom: 2px; }
.card h2 { font-size: 24px; color: var(--blue); }
.rules { list-style: none; padding: 0; margin: 16px 0 10px; display: grid; gap: 8px; }
.rules li { display: flex; align-items: center; gap: 8px; border-radius: 18px; padding: 6px 12px; font: 700 15px var(--body); text-align: left; }
.rules li.bear { background: #E3F2FF; }
.rules li.rabbit { background: #FFE7F0; }
.rules .arrow { color: var(--brown); opacity: .5; font-weight: 800; }
.rules canvas { flex: none; width: 52px; height: 52px; }
.how { font-size: 13px; line-height: 1.7; margin: 0 0 16px; color: #7A5A46; }
.btns { display: grid; gap: 10px; }
.btn {
  border: 3px solid var(--white); cursor: pointer; border-radius: 999px; padding: 12px 20px; color: var(--white);
  font: 800 19px var(--display); display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
}
.btn small { font-size: 12px; font-weight: 700; opacity: .95; }
.btn.green { background: linear-gradient(#7EDB6A, #3DB04A); box-shadow: 0 5px 0 #2C8A37, 0 10px 18px rgba(44, 138, 55, .25); }
.btn.orange { background: linear-gradient(#FFC657, #FF9418); box-shadow: 0 5px 0 #D46F06, 0 10px 18px rgba(212, 111, 6, .25); }
.btn.blue { background: linear-gradient(#5DB8FF, #2A7FE0); box-shadow: 0 5px 0 #1C5FB0, 0 10px 18px rgba(28, 95, 176, .25); }
.btn:active { transform: translateY(4px); box-shadow: none; }
.tri { width: 0; height: 0; border-left: 16px solid var(--white); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
.text-btn { margin-top: 12px; background: none; border: 0; cursor: pointer; font: 700 13px var(--body); color: #7A5A46; text-decoration: underline; text-underline-offset: 3px; }
.result { font: 800 18px var(--display); margin: 10px 0 4px; }
.result b { font-size: 44px; color: var(--orange); }
.best-line { font: 700 14px var(--body); color: #7A5A46; margin: 0 0 16px; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" aria-label="ゲーム画面。左をタップでくまちゃん、右をタップでうさぎちゃんに渡します。たべものをドラッグして届けることもできます"></canvas>

  <header class="hud">
    <div class="hud-left">
      <div class="score-pill">
        <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF07A"/><stop offset="1" stop-color="#FFB800"/></linearGradient></defs><path d="M20 3.5l4.9 10.1 11.1 1.5-8.1 7.7 2 11-9.9-5.3-9.9 5.3 2-11-8.1-7.7 11.1-1.5z" fill="url(#sg)" stroke="#F09A00" stroke-width="2" stroke-linejoin="round"/><ellipse cx="15.5" cy="15" rx="3" ry="2" fill="#fff" opacity=".7"/></svg>
        <div><span class="lbl">スコア</span><b id="score">0</b></div>
      </div>
      <div class="combo-chip" id="combo" hidden></div>
    </div>
    <div class="title-banner" aria-hidden="true">
      <div class="l1"><span class="o">パンケーキ</span> と <span class="p">ミルクシェーキ</span> を</div>
      <div class="l2">それぞれの どうぶつに とどけよう！</div>
    </div>
    <div class="hud-right">
      <div class="lives-pill" id="lives" hidden></div>
      <div class="mode-pill" id="modePill">のんびり</div>
      <button class="round-btn" id="pauseBtn" type="button" aria-label="ポーズ">
        <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><rect x="2" y="1" width="6" height="20" rx="3" fill="#fff"/><rect x="12" y="1" width="6" height="20" rx="3" fill="#fff"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3.5l4.9 10.1 11.1 1.5-8.1 7.7 2 11-9.9-5.3-9.9 5.3 2-11-8.1-7.7 11.1-1.5z" fill="#FFD54A" stroke="#F09A00" stroke-width="2" stroke-linejoin="round"/></svg>
    <span id="bannerText">がんばろう！</span>
  </div>

  <div class="overlay" id="startOv">
    <div class="card">
      <h1><small>パンケーキ と ミルクシェーキ を とどけよう</small>くまうさ もぐもぐライン</h1>
      <ul class="rules">
        <li class="bear"><canvas data-icon="pancake" width="104" height="104"></canvas><span class="arrow">→</span><canvas data-icon="bear" width="104" height="104"></canvas><span>パンケーキは<br><b>くまちゃん</b></span></li>
        <li class="rabbit"><canvas data-icon="shake" width="104" height="104"></canvas><span class="arrow">→</span><canvas data-icon="rabbit" width="104" height="104"></canvas><span>ミルクシェーキは<br><b>うさぎちゃん</b></span></li>
      </ul>
      <p class="how">たべものを <b>ドラッグ</b> して どうぶつに とどけよう。<br>画面の 左／右 を タップ しても とどきます（← → キーもOK）。</p>
      <div class="btns">
        <button class="btn green" id="zenBtn" type="button"><span class="tri"></span>スタート <small>のんびり・ずっとあそべる</small></button>
        <button class="btn orange" id="chBtn" type="button">チャレンジ <small>ライフ3つ</small></button>
      </div>
      <button class="text-btn" id="muteBtn1" type="button">おと：ON</button>
    </div>
  </div>

  <div class="overlay" id="pauseOv" hidden>
    <div class="card">
      <h2>ひとやすみ</h2>
      <p class="best-line" id="pauseBest"></p>
      <div class="btns">
        <button class="btn green" id="resumeBtn" type="button"><span class="tri"></span>つづける</button>
        <button class="btn blue" id="menuBtn" type="button">さいしょの画面へ</button>
      </div>
      <button class="text-btn" id="muteBtn2" type="button">おと：ON</button>
    </div>
  </div>

  <div class="overlay" id="overOv" hidden>
    <div class="card">
      <h2>おなかいっぱい！</h2>
      <p class="result"><b id="finalScore">0</b> こ とどけたよ</p>
      <p class="best-line" id="overBest"></p>
      <div class="btns">
        <button class="btn orange" id="againBtn" type="button">もういちど</button>
        <button class="btn green" id="zenBtn2" type="button"><span class="tri"></span>のんびりモードで あそぶ</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const bgc = document.createElement('canvas');
  const bctx = bgc.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------------- drawing primitives ----------------
  function E(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(rx, .1), Math.max(ry, .1), rot, 0, TAU); c.fillStyle = fill; c.fill(); }
  function RR(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, Math.max(w, .1), Math.max(h, .1), Math.max(0, Math.min(r, w / 2, h / 2))); }
  function lin(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
  function rad(c, x0, y0, r0, x1, y1, r1, stops) { const g = c.createRadialGradient(x0, y0, Math.max(r0, 0), x1, y1, Math.max(r1, .1)); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
  function star5(c, x, y, R, fill, stroke, lw) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * .48 : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath();
    if (stroke) { c.lineJoin = 'round'; c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
    c.fillStyle = fill; c.fill();
  }
  function sparkle(c, x, y, s, fill) {
    c.beginPath(); c.moveTo(x, y - s);
    c.quadraticCurveTo(x, y, x + s, y); c.quadraticCurveTo(x, y, x, y + s);
    c.quadraticCurveTo(x, y, x - s, y); c.quadraticCurveTo(x, y, x, y - s);
    c.fillStyle = fill; c.fill();
  }
  function heart(c, x, y, s, fill) {
    c.beginPath(); c.moveTo(x, y + s * .38);
    c.bezierCurveTo(x - s * .62, y - s * .05, x - s * .32, y - s * .62, x, y - s * .2);
    c.bezierCurveTo(x + s * .32, y - s * .62, x + s * .62, y - s * .05, x, y + s * .38);
    c.fillStyle = fill; c.fill();
    E(c, x - s * .2, y - s * .2, s * .09, s * .06, 'rgba(255,255,255,.7)', -.6);
  }
  function flower(c, x, y, s, petal, center) {
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; E(c, x + Math.cos(a) * s * .55, y + Math.sin(a) * s * .55, s * .42, s * .42, petal); }
    E(c, x, y, s * .3, s * .3, center);
  }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------------- food ----------------
  function drawPancake(c, x, y, s) {
    E(c, x, y + .37 * s, .57 * s, .15 * s, '#CFDDF0');
    E(c, x, y + .34 * s, .55 * s, .14 * s, '#FFFFFF');
    E(c, x, y + .35 * s, .39 * s, .08 * s, '#EEF3FA');
    for (let i = 0; i < 3; i++) {
      const by = y + .22 * s - i * .155 * s, rx = (.43 - i * .012) * s, ry = .13 * s;
      const side = lin(c, x - rx, 0, x + rx, 0, ['#C47428', '#E59F4C', '#F2BC6A', '#DE9440', '#B9681F']);
      E(c, x, by + .075 * s, rx, ry, side);
      c.fillStyle = side; c.fillRect(x - rx, by, rx * 2, .075 * s);
      c.fillStyle = 'rgba(255,236,190,.45)'; c.fillRect(x - rx * .92, by + .03 * s, rx * 1.84, .014 * s);
      E(c, x, by, rx, ry, rad(c, x - .1 * s, by - .03 * s, 0, x, by, rx, ['#FDE6AE', '#F7C670', '#E7A44B']));
    }
    const ty = y + .22 * s - .31 * s;
    c.fillStyle = lin(c, 0, ty - .1 * s, 0, ty + .32 * s, ['#F7AE42', '#DE7A12', '#C9650A']);
    c.beginPath(); c.ellipse(x + .02 * s, ty, .34 * s, .1 * s, 0, 0, TAU); c.fill();
    [[-.31, .2], [-.12, .3], [.13, .24], [.32, .15]].forEach(([dx, len]) => {
      const w = .075 * s; c.beginPath(); c.roundRect(x + dx * s - w / 2, ty, w, len * s, w / 2); c.fill();
    });
    c.beginPath(); c.ellipse(x + .27 * s, y + .34 * s, .14 * s, .04 * s, 0, 0, TAU); c.fill();
    E(c, x - .13 * s, ty - .03 * s, .11 * s, .025 * s, 'rgba(255,255,255,.6)', -.1);
    E(c, x - .29 * s, ty + .12 * s, .012 * s, .04 * s, 'rgba(255,255,255,.55)');
    // butter cube
    const bx = x + .01 * s, bt = ty - .07 * s, b = .13 * s;
    c.lineJoin = 'round'; c.lineWidth = .02 * s;
    const face = (pts, col) => { c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.closePath(); c.fillStyle = col; c.strokeStyle = col; c.fill(); c.stroke(); };
    face([[bx - b, bt], [bx, bt + b * .5], [bx, bt + b * 1.15], [bx - b, bt + b * .65]], '#FFE066');
    face([[bx, bt + b * .5], [bx + b, bt], [bx + b, bt + b * .65], [bx, bt + b * 1.15]], '#F0C53A');
    face([[bx, bt - b * .5], [bx + b, bt], [bx, bt + b * .5], [bx - b, bt]], '#FFF6BE');
    E(c, bx - b * .35, bt - b * .05, b * .22, b * .08, 'rgba(255,255,255,.8)', .45);
  }

  function drawShake(c, x, y, s) {
    // straw
    c.save(); c.translate(x + .08 * s, y - .26 * s); c.rotate(.38);
    const sw = .075 * s, sl = .62 * s;
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.roundRect(-sw / 2, -sl, sw, sl, sw / 2); c.fill();
    c.clip(); c.fillStyle = '#FF6F9F';
    for (let i = -sl; i < 0; i += .1 * s) { c.beginPath(); c.moveTo(-sw, i); c.lineTo(sw, i - .05 * s); c.lineTo(sw, i - .01 * s); c.lineTo(-sw, i + .04 * s); c.fill(); }
    c.restore();
    // glass
    const gt = y - .2 * s, gb = y + .24 * s;
    c.beginPath(); c.moveTo(x - .3 * s, gt); c.lineTo(x + .3 * s, gt); c.lineTo(x + .17 * s, gb - .04 * s);
    c.quadraticCurveTo(x + .15 * s, gb, x + .1 * s, gb); c.lineTo(x - .1 * s, gb);
    c.quadraticCurveTo(x - .15 * s, gb, x - .17 * s, gb - .04 * s); c.closePath();
    c.fillStyle = lin(c, 0, gt, 0, gb, ['#FFDCE8', '#FFB1CA', '#FF8DB3']); c.fill();
    c.lineWidth = .035 * s; c.strokeStyle = 'rgba(255,255,255,.95)'; c.stroke();
    c.lineWidth = .012 * s; c.strokeStyle = '#EE79A2'; c.stroke();
    c.save(); c.clip();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x - .3 * s, y - .02 * s, .6 * s, .035 * s); c.fillRect(x - .3 * s, y + .09 * s, .6 * s, .02 * s);
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.roundRect(x - .22 * s, gt + .05 * s, .05 * s, .3 * s, .025 * s); c.fill();
    c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.roundRect(x + .15 * s, gt + .06 * s, .03 * s, .18 * s, .015 * s); c.fill();
    c.restore();
    // foot
    c.fillStyle = lin(c, x - .05 * s, 0, x + .05 * s, 0, ['#EBDDE6', '#FFFFFF', '#E3D2DE']); c.fillRect(x - .04 * s, gb - .01 * s, .08 * s, .13 * s);
    E(c, x, gb + .14 * s, .21 * s, .055 * s, '#E5D3DF'); E(c, x, gb + .13 * s, .2 * s, .045 * s, '#FFFFFF');
    // rim + cream
    E(c, x, gt, .3 * s, .055 * s, '#FFE6EF');
    [[0, -.02, .32, .1], [0, -.1, .26, .09], [0, -.18, .18, .075], [.01, -.25, .09, .05]].forEach(([dx, dy, rx, ry]) => {

        const peak = Math.min(it.fy, it.ty) - L.k * 1.2;
        it.y = (1 - t) * (1 - t) * it.fy + 2 * (1 - t) * t * peak + t * t * it.ty;
        it.rot = t * (it.who === 'bear' ? -.5 : .5); it.sc = 1 - t * .3;
        if (t >= 1) arrive(it);
      } else if (it.state === 'drop') {
        it.vy += L.k * 16 * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += dt * 3;
        if (it.x > L.bowlX) it.vx *= .8;
        if (it.y > L.bowlY + L.k * .25) it.state = 'gone';
      } else if (it.state === 'reject') {
        it.vy += L.k * 16 * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += dt * 5; it.a -= dt * 1.4;
        if (it.a <= 0) it.state = 'gone';
      }
    }
    items = items.filter(i => i.state !== 'gone');
  }

  // ---------------- render ----------------
  function drawItem(it) {
    ctx.save(); ctx.globalAlpha = Math.max(0, it.a);
    ctx.translate(it.x, it.y); ctx.rotate(it.rot || 0); ctx.scale(it.sc || 1, it.sc || 1);
    if (it.state === 'drag') { E(ctx, 0, .5 * L.s, .45 * L.s, .1 * L.s, 'rgba(40,60,110,.2)'); }
    drawFood(ctx, it.type, 0, 0, L.s);
    ctx.restore();
  }
  function drawAnimal(an) {
    const r = L.r, k = L.k, still = reduceMotion;
    const breathe = still ? 0 : Math.sin(clock * 2.2 + (an.kind === 'bear' ? 0 : 1.3)) * .02 * r;
    const hop = an.party > 0 && !still ? Math.abs(Math.sin(an.party * Math.PI * 4)) * .3 * r : 0;
    const chew = an.mood === 'eat' && !still ? Math.sin(an.moodT * 30) * .03 * r : 0;
    const shake = an.mood === 'sad' && !still ? Math.sin(an.moodT * 40) * .06 * r * an.moodT : 0;
    const hx = an.x + shake, hy = L.headY - hop + breathe + chew;
    drawBoxBack(ctx, an.kind, an.x, L.boxTop, L.bw, L.bh);
    E(ctx, an.x, hy + .95 * r, .8 * r, .5 * r, BOX[an.kind].shoulder);
    drawHead(ctx, an.kind, hx, hy, r, { mood: an.mood, blink: an.blinkT < 0, wig: Math.sin(clock * 2.4) * .05 + (an.mood === 'eat' ? Math.sin(an.moodT * 20) * .08 : 0) });
    drawBoxFront(ctx, an.kind, an.food, an.x, L.boxTop, L.bw, L.bh);
    if (an.hold) {
      const fy = hy + .7 * r;
      drawFood(ctx, an.hold, hx, fy, r * .95);
      drawPaws(ctx, an.kind, hx, fy + .15 * r, r, .38 * r);
    } else drawPaws(ctx, an.kind, an.x, L.boxTop + .02 * k, r, .5 * r);
    if (an.mood === 'eat' && !still) {
      const t = clock * 4;
      sparkle(ctx, hx - 1.05 * r, hy - .4 * r + Math.sin(t) * 4, .12 * r, '#FFD54A');
      sparkle(ctx, hx + 1.1 * r, hy - .1 * r + Math.cos(t) * 4, .1 * r, '#FFD54A');
      heart(ctx, hx + .95 * r, hy - .75 * r + Math.sin(t + 1) * 3, .26 * r, '#FF6F9C');
    }
  }
  function draw() {
    ctx.drawImage(bgc, 0, 0, W, H);
    drawBelt(ctx);
    const f = playing ? frontItem() : null;
    if (f) {
      E(ctx, f.x, L.beltY - .1 * L.k, .55 * L.s, .14 * L.s, 'rgba(255,230,120,.55)');
      const ay = L.itemY - .95 * L.s - Math.abs(Math.sin(clock * 5)) * .12 * L.s;
      ctx.beginPath(); ctx.moveTo(f.x - .14 * L.s, ay - .14 * L.s); ctx.lineTo(f.x + .14 * L.s, ay - .14 * L.s); ctx.lineTo(f.x, ay + .02 * L.s); ctx.closePath();
      ctx.fillStyle = '#FFD54A'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#FFFFFF'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.fill();
    }
    for (const it of items) if (it.state === 'belt' || it.state === 'return') drawItem(it);
    drawBowl(ctx, 'back');
    for (const it of items) if (it.state === 'drop') drawItem(it);
    drawBowl(ctx, 'front');
    drawAnimal(animals.bear); drawAnimal(animals.rabbit);
    for (const it of items) if (it.state === 'fly' || it.state === 'reject' || it.state === 'drag') drawItem(it);
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.kind === 'heart') heart(ctx, p.x, p.y, p.size, p.col); else sparkle(ctx, p.x, p.y, p.size * .6, p.col);
    }
    ctx.globalAlpha = 1;
    for (const k in animals) {
      const an = animals[k];
      if (!an.bubble) continue;
      ctx.globalAlpha = Math.min(1, an.bubble.life * 4);
      drawBubble(ctx, an.x, L.headY - (an.kind === 'rabbit' ? 2.05 : 1.55) * L.r, an.bubble.text, an.bubble.color);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = `800 ${clamp(L.k * .32, 14, 24)}px "M PLUS Rounded 1c", sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = '#FFFFFF'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }
  function frame(t) {
    const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------------- boot ----------------
  function drawIcons() {
    document.querySelectorAll('canvas[data-icon]').forEach(c => {
      const g = c.getContext('2d'), n = c.dataset.icon; g.clearRect(0, 0, 104, 104);
      if (n === 'pancake' || n === 'shake') drawFoodIcon(g, n, 52, 54, 78);
      else drawHead(g, n, 52, n === 'rabbit' ? 66 : 58, n === 'rabbit' ? 30 : 36, { mood: 'idle' });
    });
  }
  function boot(data) {
    renderMute(); layout(); prefill(); updateHud(); drawIcons();
    if (data && data.playing) {
      mode = data.mode || 'zen'; score = data.score || 0; combo = data.combo || 0; lives = data.lives ?? 3;
      playing = true; $('startOv').hidden = true; $('lives').hidden = mode !== 'challenge'; $('modePill').hidden = mode === 'challenge'; updateHud();
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildBg(); drawIcons(); });
    addEventListener('resize', () => { layout(); for (const it of items) if (it.state === 'belt') it.y = L.itemY; });
    requestAnimationFrame(t => { lastT = t; frame(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ mode, score, combo, lives, playing }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
