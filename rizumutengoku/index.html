<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>リズムあそび</title>
<style>
  :root { --bg:#fff6e0; --ink:#3a2a1a; --accent:#ff7a59; --sub:#7a6a5a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;
    overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(255,246,224,.96); text-align:center; padding:16px;
    box-sizing:border-box; overflow-y:auto; }
  .hidden { display:none; }
  h1 { margin:0; font-size:clamp(28px,7vw,44px); letter-spacing:.05em; }
  h2 { margin:0; font-size:clamp(32px,9vw,64px); }
  p { margin:0; line-height:1.7; }
  .how { max-width:560px; font-size:15px; color:var(--sub); }
  .how b { color:var(--ink); }
  button { font:inherit; font-size:20px; padding:12px 32px; border-radius:999px; border:3px solid var(--ink);
    background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:#fff; color:var(--ink); font-size:16px; padding:8px 22px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .stages { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:760px; }
  .card { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:14px 16px; width:300px;
    max-width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .card h3 { margin:0; font-size:20px; }
  .card p { font-size:14px; color:var(--sub); line-height:1.6; }
  .card .meta { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); }
  .card button { font-size:16px; padding:6px 22px; }
  .offset { font-size:13px; color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .offset input { width:240px; }
  table { border-collapse:collapse; font-size:16px; }
  td { padding:2px 12px; }
  td:last-child { text-align:right; font-weight:bold; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="overlay">
  <h1>リズムあそび</h1>
  <p class="how">ベースで拍をとって、リードに合わせて遊ぶ。<b>目で追うより、音を聞いてノる</b>のがコツ。</p>
  <div id="stages" class="stages"></div>
  <label class="offset">
    <span>タイミング補正：<span id="offVal">0</span> ms（入力がいつも遅れると判定される場合は＋側へ）</span>
    <input id="offset" type="range" min="-100" max="150" step="5" value="0">
  </label>
  <p class="how">プレイ中に Esc でやめる</p>
</div>

<div id="result" class="overlay hidden">
  <h2 id="rank"></h2>
  <p id="comment"></p>
  <table id="detail"></table>
  <div class="row">
    <button id="retryBtn">もういちど</button>
    <button id="backBtn" class="sub">ゲームをえらぶ</button>
  </div>
</div>

<script>
"use strict";

// ================= 共通設定 =================
const BPM = 120;
const BEAT = 60 / BPM;
const WIN = { just: 0.045, ok: 0.09, barely: 0.15 }; // 判定幅（秒）
const W = 800, H = 450, GROUND = 380;

// ================= オーディオ =================
const A = { ctx: null, noise: null };

function ensureAudio() {
  if (!A.ctx) {
    A.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    const len = A.ctx.sampleRate;
    A.noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    const d = A.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (A.ctx.state === "suspended") A.ctx.resume();
}

function latency() {
  const c = A.ctx;
  return c.outputLatency || c.baseLatency || 0;
}

function env(g, t, a, peak, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}

function tone(dest, t, freq, type, dur, vol, a = 0.005) {
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  env(g, t, a, vol, dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + a + dur + 0.05);
  return o;
}

function noise(dest, t, dur, vol, ftype, freq, q = 1) {
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.noise;
  f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  env(g, t, 0.002, vol, dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

function panTo(dest, p) {
  const n = A.ctx.createStereoPanner();
  n.pan.value = p;
  n.connect(dest);
  return n;
}

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

const SND = {
  kick(d, t) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    env(g, t, 0.002, 0.9, 0.25);
    o.connect(g).connect(d); o.start(t); o.stop(t + 0.35);
  },
  snare(d, t) { noise(d, t, 0.15, 0.45, "bandpass", 1800, 0.8); tone(d, t, 190, "triangle", 0.08, 0.25); },
  hat(d, t, v = 0.15) { noise(d, t, 0.04, v, "highpass", 8000); },
  crash(d, t) { noise(d, t, 1.4, 0.35, "highpass", 5000); },
  block(d, t, hi) { tone(d, t, hi ? 1600 : 1100, "sine", 0.07, 0.6); },
  miss(d, t) {
    const o = tone(d, t, 220, "sawtooth", 0.3, 0.25);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
    noise(d, t, 0.12, 0.5, "lowpass", 400);
  },
  whiff(d, t) { noise(d, t, 0.08, 0.15, "bandpass", 1200, 3); },
};

// ベース（土台）：C - Am - F - G を4分音符で刻むだけ。メロディは持たない
const ROOTS = [0, 9, 5, 7];

function scheduleBase(g) {
  const { music, sfx, t0, endBeat } = g;
  const bt = b => t0 + b * BEAT;
  for (let b = 0; b < 4; b++) SND.block(sfx, bt(b), b === 3); // カウントイン
  for (let b = 0; b < endBeat; b++) {
    const inBar = b % 4, bar = Math.floor(b / 4);
    if (g.mute && g.mute.has(bar)) continue;
    SND.hat(music, bt(b), 0.12);
    if (b < 4) continue;
    if (inBar === 0 || inBar === 2) SND.kick(music, bt(b));
    if (inBar === 1 || inBar === 3) SND.snare(music, bt(b));
    tone(music, bt(b), midi(36 + ROOTS[bar % 4]), "triangle", 0.35, 0.5);
  }
  const tEnd = bt(endBeat);
  SND.kick(music, tEnd); SND.crash(music, tEnd);
  for (const n of [48, 60, 64, 67, 72]) tone(music, tEnd, midi(n), "triangle", 1.2, 0.18);
}

// ================= 描画の共通部品 =================
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let view = { s: 1, ox: 0, oy: 0 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const s = Math.min(innerWidth / W, innerHeight / H);
  view = { s: s * dpr, ox: (innerWidth - W * s) / 2 * dpr, oy: (innerHeight - H * s) / 2 * dpr };
}
addEventListener("resize", resize);
resize();

function star(x, y, r) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  cx.fill();
}

function bubble(x, y, text, size = 22) {
  cx.font = `bold ${size}px sans-serif`; cx.textAlign = "center";
  const w = cx.measureText(text).width + 28;
  cx.fillStyle = "#fff"; cx.strokeStyle = "#3a2a1a"; cx.lineWidth = 3;
  cx.beginPath(); cx.roundRect(x - w / 2, y - size, w, size * 1.8, 14); cx.fill(); cx.stroke();
  cx.fillStyle = "#3a2a1a"; cx.fillText(text, x, y + size * 0.3);
}

// ================= ゲーム1：なわとび =================
// 譜面：前のジャンプから次のジャンプまでの拍数（1=通常, 2=ゆっくり, 0.5=すばやく）
const NAWA_BAR = {
  A:  [1, 1, 1, 1],
  M:  [2, 1, 1],
  S:  [2, 2],
  F:  [1, 1, 0.5, 0.5, 1],
  F2: [0.5, 0.5, 1, 0.5, 0.5, 1],
};
const NAWA_SONG = ["A","A","A","A", "M","A","M","A", "F","A","F","A",
                   "S","A","M","F", "F2","A","F2","M", "F","F2","S","A", "A"];
// リード：ジャンプのタイミングでだけ鳴る。和音の構成音から選ぶ
const CHORD_TONES = [[60, 64, 67, 72], [57, 60, 64, 69], [57, 60, 65, 69], [55, 59, 62, 67]];
const LEAD_STEP = [0, 1, 2, 3, 3, 2, 1, 2];

const nawa = {
  id: "nawa",
  name: "ぴょんぴょん なわとび",
  desc: "なわが地面に当たる瞬間にジャンプ。「ゆっくり〜」「タタッ！」の合図でリズムが変わる。",
  ops: "タップ / スペース",
  keys: 1,
  comments: [
    "なわとび名人。もう縄が止まって見える。",
    "リズムに乗れてる。合図のところを詰めれば上へ。",
    "跳べてはいる。画面より音に集中してみよう。",
    "目で追うと間に合わない。耳で跳ぼう。",
  ],

  build(g) {
    let b = 3; // 最初のジャンプは4拍目（カウントイン直後）
    for (const iv of NAWA_SONG.flatMap(k => NAWA_BAR[k])) {
      b += iv;
      g.hits.push({ beat: b, t: g.t0 + b * BEAT, iv, key: null, j: null });
    }
    g.hits.forEach((h, i) => {
      const prevIv = i > 0 ? g.hits[i - 1].iv : 1;
      if (h.iv !== 1 && h.iv !== prevIv) {
        g.cues.push({ t: g.t0 + (h.beat - h.iv - 1) * BEAT, type: h.iv > 1 ? "slow" : "fast" });
      }
    });
    g.endBeat = Math.ceil((b + 1) / 4) * 4;
    g.st = { jumpAt: -9, kind: null, tripAt: -9, fx: [] };
  },

  leadNote(h) {
    const tones = CHORD_TONES[Math.floor(h.beat / 4) % 4];
    if (h.iv > 1) return tones[0] - 12;
    return tones[LEAD_STEP[Math.floor((h.beat % 4) * 2)]] + (h.iv < 1 ? 12 : 0);
  },

  schedule(g) {
    // リード：変則リズムがそのまま旋律として聞こえる
    for (const h of g.hits) {
      const n = this.leadNote(h), dur = h.iv > 1 ? 0.7 : h.iv < 1 ? 0.12 : 0.25;
      tone(g.lead, h.t, midi(n), "square", dur, 0.16);
      tone(g.lead, h.t, midi(n + 12), "triangle", dur * 0.6, 0.08);
    }
    for (const c of g.cues) {
      if (c.type === "slow") {
        tone(g.sfx, c.t, midi(67), "triangle", 0.18, 0.7);
        tone(g.sfx, c.t + 0.2, midi(60), "triangle", 0.45, 0.7);
      } else {
        tone(g.sfx, c.t, 1250, "square", 0.05, 0.25);
        tone(g.sfx, c.t + BEAT / 2, 1250, "square", 0.05, 0.25);
      }
    }
  },

  onJudge(g, h, grade, tv, key, now) {
    noise(g.sfx, now, 0.05, 0.5, "bandpass", 3000, 2); // なわの「パシッ」
    if (grade === "barely") tone(g.sfx, now, 300, "sawtooth", 0.06, 0.08);
    const s = g.st;
    s.jumpAt = tv; s.kind = grade;
    if (grade === "just") s.fx.push({ t: tv, type: "star" });
    if (grade === "barely") s.fx.push({ t: tv, type: "sweat" });
  },
  onWhiff(g, tv, key, now) { SND.whiff(g.sfx, now); g.st.jumpAt = tv; g.st.kind = "whiff"; },
  onMiss(g, h, now) { SND.miss(g.sfx, now); g.st.tripAt = h.t; },

  ropePhase(g, tv) {
    const hs = g.hits;
    let prev = hs[0].t - hs[0].iv * BEAT;
    if (tv < prev + 0.5 * (hs[0].t - prev)) return 0.5;
    for (const h of hs) {
      if (tv < h.t) return (tv - prev) / (h.t - prev);
      prev = h.t;
    }
    const p = (tv - prev) / BEAT;
    return p < 0.5 ? p : 0.5;
  },

  turner(x, y, w, h, color, flip, phase) {
    cx.fillStyle = color;
    cx.beginPath(); cx.roundRect(x - w / 2, y - h, w, h, w / 2); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(x - 9 * flip + 6 * flip, y - h + 32, 4, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(x + 9 * flip + 6 * flip, y - h + 32, 4, 0, 7); cx.fill();
    cx.fillRect(x - 6 + 6 * flip, y - h + 46, 12, 3);
    const a = phase * Math.PI * 2;
    const hand = { x: x + 50 * flip + Math.sin(a) * 10 * flip, y: 232 + Math.cos(a) * 12 };
    cx.strokeStyle = color; cx.lineWidth = 10; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(x + 15 * flip, y - h + 80); cx.lineTo(hand.x, hand.y); cx.stroke();
    return hand;
  },

  rope(l, r, phase, front) {
    const cy = 287.5 + 357.5 * Math.cos(phase * Math.PI * 2);
    cx.strokeStyle = "#7a3e1c"; cx.lineWidth = front ? 5 : 3;
    cx.beginPath(); cx.moveTo(l.x, l.y); cx.quadraticCurveTo(400, cy, r.x, r.y); cx.stroke();
  },

  groundCue(g, tv, phase) {
    // なわの影：地面に近づくほど濃く、小さく集まる
    const near = (Math.cos(phase * Math.PI * 2) + 1) / 2;
    cx.fillStyle = `rgba(90,50,20,${0.08 + 0.32 * near * near})`;
    cx.beginPath(); cx.ellipse(400, GROUND + 14, 260 - 170 * near, 5 + 4 * near, 0, 0, 7); cx.fill();
    // 地面に当たった瞬間の土ぼこり
    let hit = null;
    for (const h of g.hits) {
      const d = tv - h.t;
      if (d < -1) break;
      if (d >= 0 && d < 0.25) hit = h;
    }
    if (!hit) return;
    const e = (tv - hit.t) / 0.25;
    cx.fillStyle = `rgba(140,110,70,${0.6 * (1 - e)})`;
    for (const dx of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        cx.beginPath();
        cx.arc(400 + dx * (60 + 70 * e + i * 18), GROUND + 6 - 18 * e - i * 6, 7 - i * 1.5, 0, 7);
        cx.fill();
      }
    }
  },

  player(g, tv) {
    const p = g.st;
    let lift = 0, tilt = 0;
    const dur = p.kind === "whiff" ? 0.25 : 0.38;
    const k = (tv - p.jumpAt) / dur;
    if (k >= 0 && k <= 1) lift = (p.kind === "whiff" ? 45 : 110) * Math.sin(Math.PI * k);
    const tk = (tv - p.tripAt) / 0.6;
    const tripping = tk >= 0 && tk <= 1;
    if (tripping) { tilt = Math.sin(tk * Math.PI) * 0.6; lift = 0; }

    cx.fillStyle = "rgba(0,0,0,.15)";
    cx.beginPath(); cx.ellipse(400, GROUND + 4, 34 - lift * 0.12, 8, 0, 0, 7); cx.fill();

    cx.save();
    cx.translate(400, GROUND - lift);
    cx.rotate(tilt);
    cx.strokeStyle = "#3a2a1a"; cx.lineWidth = 6; cx.lineCap = "round";
    const spread = lift > 10 ? 14 : 8;
    cx.beginPath(); cx.moveTo(-10, -24); cx.lineTo(-spread, 0); cx.moveTo(10, -24); cx.lineTo(spread, 0); cx.stroke();
    cx.fillStyle = "#ffcc4d";
    cx.beginPath(); cx.ellipse(0, -58, 32, 38, 0, 0, 7); cx.fill();
    cx.fillStyle = "#3a2a1a";
    if (tripping) {
      cx.font = "bold 18px sans-serif"; cx.textAlign = "center";
      cx.fillText("× ×", 0, -60);
    } else {
      cx.beginPath(); cx.arc(-11, -64, 4.5, 0, 7); cx.arc(11, -64, 4.5, 0, 7); cx.fill();
      cx.beginPath();
      if (lift > 10) cx.arc(0, -48, 7, 0, Math.PI); else cx.rect(-6, -48, 12, 3);
      cx.fill();
    }
    cx.fillStyle = "rgba(255,120,120,.5)";
    cx.beginPath(); cx.arc(-21, -52, 5, 0, 7); cx.arc(21, -52, 5, 0, 7); cx.fill();
    cx.restore();

    if (tripping) {
      cx.fillStyle = "#3a2a1a"; cx.font = "bold 22px sans-serif"; cx.textAlign = "center";
      cx.fillText("いてっ", 400, GROUND - 120);
    }
    p.fx = p.fx.filter(f => tv - f.t < 0.5);
    for (const f of p.fx) {
      const e = (tv - f.t) / 0.5;
      cx.globalAlpha = 1 - e;
      if (f.type === "star") {
        cx.fillStyle = "#ffb300";
        for (const dx of [-40, 40]) star(400 + dx * (1 + e), GROUND - 20 - 30 * e, 8);
      } else {
        cx.fillStyle = "#4aa3df";
        cx.beginPath(); cx.arc(440, GROUND - 110 + 20 * e, 6, 0, 7); cx.fill();
      }
      cx.globalAlpha = 1;
    }
  },

  draw(g, tv) {
    const sky = cx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#ffe2a8"); sky.addColorStop(1, "#fff6e0");
    cx.fillStyle = sky; cx.fillRect(0, 0, W, GROUND);
    cx.fillStyle = "#ffd36b"; cx.beginPath(); cx.arc(680, 80, 40, 0, 7); cx.fill();
    cx.fillStyle = "#8fd16a"; cx.fillRect(0, GROUND, W, H - GROUND);

    const phase = this.ropePhase(g, tv);
    const back = Math.cos(phase * Math.PI * 2) < 0;
    const l = this.turner(120, GROUND, 64, 160, "#5aa9e6", 1, phase);
    const r = this.turner(680, GROUND, 64, 160, "#f28ab2", -1, phase);
    this.groundCue(g, tv, phase);
    if (back) this.rope(l, r, phase, false);
    this.player(g, tv);
    if (!back) this.rope(l, r, phase, true);

    for (const c of g.cues) {
      if (tv >= c.t && tv < c.t + 0.9) {
        if (c.type === "slow") bubble(140, 170, "ゆっくり〜");
        else bubble(660, 170, "タタッ！");
      }
    }
  },
};

// ================= ゲーム2：まねっこ小鳥 =================
// お手本1小節 → まねっこ1小節。[小節内の拍, "L"=ひくい / "R"=たかい]
const MANE_PHRASES = {
  p1: [[0, "L"], [1, "L"], [2, "L"]],
  p2: [[0, "L"], [1, "R"], [2, "L"]],
  p3: [[0, "R"], [1, "R"], [2, "L"], [3, "L"]],
  p4: [[0, "L"], [0.5, "L"], [1, "R"], [2, "R"]],
  p5: [[0, "R"], [1, "L"], [1.5, "L"], [2, "R"]],
  p6: [[0, "L"], [0.5, "R"], [1, "L"], [2, "R"], [2.5, "R"]],
  p7: [[0, "L"], [1.5, "R"], [2, "R"], [3, "L"]],
  p8: [[0, "R"], [0.5, "R"], [1, "R"], [2, "L"], [2.5, "L"], [3, "L"]],
};
const MANE_SONG = ["p1", "p1", "p2", "p2", "p3", "p4", "p5", "p4", "p6", "p7", "p8", "p6"];
const MANE_PITCH = { L: 72, R: 79 };

const mane = {
  id: "mane",
  name: "まねっこ小鳥",
  desc: "先生の歌を聞いて、次の小節で同じように歌い返す。ひくい音とたかい音を使い分ける。",
  ops: "F＝ひくい / J＝たかい（画面の左右タップ）",
  keys: 2,
  comments: [
    "完コピ。先生もびっくり。",
    "よく聞けてる。高い・低いの切りかえを詰めれば上へ。",
    "リズムは取れてる。音の高さまで聞き分けよう。",
    "まずは先生の歌を最後まで聞くことから。",
  ],

  build(g) {
    g.phrases = [];
    let bar = 1;
    for (const key of MANE_SONG) {
      const callBeat = bar * 4;
      const notes = MANE_PHRASES[key].map(([b, k]) => ({ b, key: k, t: g.t0 + (callBeat + b) * BEAT }));
      const hits = notes.map(n => ({ beat: callBeat + 4 + n.b, t: n.t + 4 * BEAT, key: n.key, j: null }));
      g.phrases.push({ callBeat, notes, hits });
      g.hits.push(...hits);
      bar += 2;
    }
    g.endBeat = bar * 4;
    g.st = { pressAt: -9, pressKey: null, badAt: -9, goodAt: -9, pad: { L: -9, R: -9 } };
  },

  chirp(dest, t, key, teacher) {
    const f = midi(MANE_PITCH[key]);
    const o = tone(dest, t, f * 1.08, "square", 0.16, teacher ? 0.14 : 0.12);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    tone(dest, t, f * 2, "triangle", 0.1, teacher ? 0.05 : 0.08);
  },

  schedule(g) {
    for (const p of g.phrases) for (const n of p.notes) this.chirp(g.lead, n.t, n.key, true);
  },

  onPress(g, tv, key, now) {
    // プレイヤーが押した音がそのままリードになる
    this.chirp(g.lead, now, key, false);
    g.st.pressAt = tv; g.st.pressKey = key; g.st.pad[key] = tv;
  },
  onJudge(g, h, grade, tv, key, now) {
    this.onPress(g, tv, key, now);
    if (grade === "wrong") g.st.badAt = tv; else g.st.goodAt = tv;
  },
  onWhiff(g, tv, key, now) { this.onPress(g, tv, key, now); g.st.badAt = tv; },
  onMiss(g, h, now) { noise(g.sfx, now, 0.1, 0.25, "lowpass", 500); g.st.badAt = h.t; },

  bird(x, y, r, color, belly, flip, open, mood) {
    cx.save();
    cx.translate(x, y);
    cx.scale(flip, 1);
    // しっぽ
    cx.fillStyle = color;
    cx.beginPath(); cx.moveTo(-r * 0.8, -r * 0.2); cx.lineTo(-r * 1.5, -r * 0.6); cx.lineTo(-r * 1.4, r * 0.1); cx.fill();
    // からだ
    cx.beginPath(); cx.arc(0, -r, r, 0, 7); cx.fill();
    cx.fillStyle = belly;
    cx.beginPath(); cx.ellipse(r * 0.2, -r * 0.7, r * 0.6, r * 0.5, 0, 0, 7); cx.fill();
    // つばさ
    cx.fillStyle = "rgba(0,0,0,.12)";
    cx.beginPath(); cx.ellipse(-r * 0.2, -r * 0.8, r * 0.5, r * 0.32, open ? -0.6 : -0.2, 0, 7); cx.fill();
    // め
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(r * 0.35, -r * 1.3, r * 0.1, 0, 7); cx.fill();
    // くちばし
    cx.fillStyle = "#ff9a3c";
    const bx = r * 0.85, by = -r * 1.1, bl = r * 0.45, gap = open ? r * 0.22 : 0;
    cx.beginPath(); cx.moveTo(bx, by - r * 0.15); cx.lineTo(bx + bl, by - gap * 0.5); cx.lineTo(bx, by); cx.fill();
    cx.beginPath(); cx.moveTo(bx, by + r * 0.02); cx.lineTo(bx + bl * 0.8, by + gap); cx.lineTo(bx, by + r * 0.15); cx.fill();
    // ほっぺ
    cx.fillStyle = "rgba(255,120,120,.45)";
    cx.beginPath(); cx.arc(r * 0.3, -r * 0.95, r * 0.12, 0, 7); cx.fill();
    // あし
    cx.strokeStyle = "#ff9a3c"; cx.lineWidth = 4; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-r * 0.2, -r * 0.05); cx.lineTo(-r * 0.25, 8); cx.moveTo(r * 0.2, -r * 0.05); cx.lineTo(r * 0.25, 8); cx.stroke();
    cx.restore();
    if (mood === "sad") {
      cx.fillStyle = "#4aa3df";
      cx.beginPath(); cx.arc(x + r * 0.9 * -flip, y - r * 1.8, 6, 0, 7); cx.fill();
    }
    if (mood === "happy") {
      cx.fillStyle = "#ffb300";
      star(x + r * 1.1 * -flip, y - r * 2, 9);
    }
  },

  draw(g, tv) {
    const sky = cx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#cfeeff"); sky.addColorStop(1, "#f4fbff");
    cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
    // 枝
    cx.strokeStyle = "#8a5a33"; cx.lineWidth = 16; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-20, 318); cx.quadraticCurveTo(400, 300, 820, 322); cx.stroke();
    cx.fillStyle = "#7cc56b";
    for (const [lx, ly] of [[80, 300], [330, 296], [500, 298], [740, 304]]) {
      cx.beginPath(); cx.ellipse(lx, ly, 22, 10, -0.4, 0, 7); cx.fill();
    }

    const cb = (tv - g.t0) / BEAT; // いま何拍目か
    const ph = g.phrases.find(p => cb >= p.callBeat - 0.5 && cb < p.callBeat + 7.75);
    const inResp = ph && cb >= ph.callBeat + 4;
    const bob = cb >= 0 && cb < g.endBeat ? -5 * Math.max(0, 1 - (cb % 1) * 4) : 0;

    // 歌のパネル：歌った音が段に並ぶ（上=たかい / 下=ひくい）
    const PX = 200, STEP = 120, RY = { R: 82, L: 138 };
    cx.fillStyle = "rgba(255,255,255,.75)";
    cx.beginPath(); cx.roundRect(120, 30, 560, 165, 18); cx.fill();
    cx.font = "13px sans-serif"; cx.textAlign = "left"; cx.fillStyle = "#7a6a5a";
    cx.fillText("たかい", 132, RY.R + 5); cx.fillText("ひくい", 132, RY.L + 5);
    for (let i = 0; i < 4; i++) {
      const x = PX + i * STEP;
      cx.strokeStyle = "rgba(58,42,26,.12)"; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(x, 55); cx.lineTo(x, 162); cx.stroke();
      // 拍の目印
      const lit = ph && Math.floor(cb) % 4 === i && cb >= ph.callBeat;
      cx.fillStyle = lit ? (inResp ? "#ffb300" : "#4fae6c") : "rgba(58,42,26,.15)";
      cx.beginPath(); cx.arc(x, 178, lit ? 7 : 5, 0, 7); cx.fill();
    }
    if (ph) {
      cx.font = "bold 16px sans-serif"; cx.textAlign = "right";
      cx.fillStyle = inResp ? "#d88a00" : "#3c8a55";
      cx.fillText(inResp ? "あなたの番" : "よく聞いて", 668, 52);
      // いま歌っている位置
      const pos = cb - (inResp ? ph.callBeat + 4 : ph.callBeat);
      if (pos >= 0 && pos < 4) {
        const x = PX + pos * STEP;
        cx.strokeStyle = inResp ? "rgba(255,179,0,.7)" : "rgba(79,174,108,.7)"; cx.lineWidth = 3;
        cx.beginPath(); cx.moveTo(x, 58); cx.lineTo(x, 160); cx.stroke();
      }
      ph.notes.forEach((n, i) => {
        if (tv < n.t) return;
        const h = ph.hits[i], x = PX + n.b * STEP, y = RY[n.key];
        const pop = Math.max(0, 1 - (tv - n.t) / 0.15);
        const bad = h.j === "miss" || h.j === "wrong";
        cx.fillStyle = bad ? "#bbb" : n.key === "R" ? "#ff8a3d" : "#4a90d9";
        cx.beginPath(); cx.arc(x, y, 15 + pop * 6, 0, 7); cx.fill();
        if (h.j && !bad) {
          cx.strokeStyle = "#ffb300"; cx.lineWidth = 4;
          cx.beginPath(); cx.arc(x, y, 21, 0, 7); cx.stroke();
        }
        if (bad) {
          cx.strokeStyle = "#fff"; cx.lineWidth = 3;
          cx.beginPath(); cx.moveTo(x - 6, y - 6); cx.lineTo(x + 6, y + 6); cx.moveTo(x + 6, y - 6); cx.lineTo(x - 6, y + 6); cx.stroke();
        }
      });
    }

    // 鳥たち
    const s = g.st;
    const teacherSing = ph && ph.notes.some(n => tv - n.t >= 0 && tv - n.t < 0.15);
    const tMood = tv - s.badAt < 0.6 ? "sad" : null;
    this.bird(250, 312 + bob, 50, "#6cc58a", "#c8ecd2", 1, teacherSing, tMood);
    const pMood = tv - s.badAt < 0.6 ? "sad" : tv - s.goodAt < 0.4 ? "happy" : null;
    this.bird(560, 312 + bob, 40, "#ffcc4d", "#fff0b8", -1, tv - s.pressAt < 0.15, pMood);

    // タップ用パッド
    for (const [key, x, label, color] of [["L", 150, "ひくい（F）", "74,144,217"], ["R", 410, "たかい（J）", "255,138,61"]]) {
      const flash = Math.max(0, 1 - (tv - s.pad[key]) / 0.15);
      cx.fillStyle = `rgba(${color},${0.18 + flash * 0.5})`;
      cx.beginPath(); cx.roundRect(x, 360, 240, 70, 18); cx.fill();
      cx.fillStyle = "#3a2a1a"; cx.font = "bold 18px sans-serif"; cx.textAlign = "center";
      cx.fillText(label, x + 120, 401);
    }
  },
};

// ================= ゲーム3：もちつき =================
// 相方の「ハイ！」（表拍）の半拍後＝ウラ拍でつく
const MOCHI_SONG = ["demo", "N", "N", "N", "N", "H", "N", "H", "N", "N", "R", "N",
                    "N", "H", "H", "N", "R", "N", "N", "H", "N", "N", "N", "N"];
const MOCHI_BAR = { demo: [0.5, 1.5, 2.5, 3.5], N: [0.5, 1.5, 2.5, 3.5], H: [1.5, 3.5], R: [] };

const mochi = {
  id: "mochi",
  name: "ぺったん もちつき",
  desc: "相方の「ハイ！」の手が引いた<b>ウラ拍</b>でつく。「おおきく」でゆったり、「ストップ」で1小節休み。",
  ops: "タップ / スペース",
  keys: 1,
  comments: [
    "職人の手さばき。お餅もつやつや。",
    "いいテンポ。合図の切りかえを詰めれば上へ。",
    "「ハイ」の直後にきねを落とす感覚をつかもう。",
    "「ハイ」と同時に打つと相方の手に当たる。半拍まとう。",
  ],

  build(g) {
    g.st = { calls: [], demo: [], swingAt: -9, ouchAt: -9, fx: [], n: 0 };
    MOCHI_SONG.forEach((type, i) => {
      const base = (i + 1) * 4;
      for (const off of MOCHI_BAR[type]) {
        const beat = base + off, t = g.t0 + beat * BEAT;
        g.st.calls.push(g.t0 + (beat - 0.5) * BEAT);
        if (type === "demo") g.st.demo.push(t);
        else g.hits.push({ beat, t, key: null, j: null });
      }
      const next = MOCHI_SONG[i + 1];
      if (next === "R" || next === "H") g.cues.push({ t: g.t0 + (base + 3) * BEAT, type: next });
    });
    g.endBeat = (MOCHI_SONG.length + 1) * 4;
    g.demoEnd = g.t0 + 8 * BEAT;
  },

  pound(dest, t, beat) {
    noise(dest, t, 0.12, 0.7, "lowpass", 260);
    const o = tone(dest, t, 160, "sine", 0.12, 0.5);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
    const tones = CHORD_TONES[Math.floor(beat / 4) % 4];
    tone(dest, t, midi(tones[Math.floor(beat * 2) % 4] + 12), "square", 0.1, 0.09);
  },

  schedule(g) {
    for (const t of g.st.calls) {
      if (g.cues.some(c => Math.abs(c.t - t) < 0.01)) continue;
      tone(g.sfx, t, midi(79), "square", 0.06, 0.08);
      tone(g.sfx, t, midi(67), "triangle", 0.1, 0.3);
    }
    for (const c of g.cues) {
      if (c.type === "R") {
        tone(g.sfx, c.t, midi(67), "triangle", 0.15, 0.5);
        tone(g.sfx, c.t + 0.15, midi(60), "triangle", 0.3, 0.5);
      } else {
        const o = tone(g.sfx, c.t, midi(60), "triangle", 0.4, 0.5);
        o.frequency.exponentialRampToValueAtTime(midi(72), c.t + 0.35);
      }
    }
    for (const t of g.st.demo) this.pound(g.lead, t, (t - g.t0) / BEAT);
  },

  handDepth(g, tv) {
    let d = 0;
    for (const t of g.st.calls) {
      if (t - tv > 0.3) break;
      d = Math.max(d, 1 - Math.abs(tv - t) / 0.22);
    }
    return d;
  },

  onJudge(g, h, grade, tv, key, now) {
    this.pound(g.lead, now, h.beat);
    g.st.swingAt = tv;
    if (grade === "just") g.st.fx.push({ t: tv });
  },
  onWhiff(g, tv, key, now) {
    noise(g.sfx, now, 0.08, 0.4, "lowpass", 300);
    g.st.swingAt = tv;
    if (this.handDepth(g, tv) > 0.3) {
      g.st.ouchAt = tv;
      const o = tone(g.sfx, now, 600, "sawtooth", 0.2, 0.15);
      o.frequency.exponentialRampToValueAtTime(300, now + 0.2);
    }
  },
  onMiss(g, h, now) { noise(g.sfx, now, 0.1, 0.2, "lowpass", 500); },

  draw(g, tv) {
    const wall = cx.createLinearGradient(0, 0, 0, 360);
    wall.addColorStop(0, "#f7e3c4"); wall.addColorStop(1, "#fbefdc");
    cx.fillStyle = wall; cx.fillRect(0, 0, W, 360);
    cx.fillStyle = "#c99a6b"; cx.fillRect(0, 360, W, H - 360);
    cx.fillStyle = "#e9cfa7";
    for (let x = 40; x < W; x += 120) cx.fillRect(x, 0, 6, 360);

    // 臼とお餅
    let swing = 0;
    for (const t of [g.st.swingAt, ...g.st.demo]) {
      const k = tv - t;
      if (k >= 0 && k < 0.06) swing = Math.max(swing, k / 0.06);
      else if (k >= 0.06 && k < 0.3) swing = Math.max(swing, 1 - (k - 0.06) / 0.24);
    }
    const squish = swing > 0.85 ? 1 : 0;
    cx.fillStyle = "#9b6a3d";
    cx.beginPath(); cx.roundRect(330, 300, 140, 75, 14); cx.fill();
    cx.fillStyle = "#7a4f2a";
    cx.beginPath(); cx.ellipse(400, 300, 72, 18, 0, 0, 7); cx.fill();
    cx.fillStyle = "#fffdf6";
    cx.beginPath(); cx.ellipse(400, 294 + squish * 3, 52 + squish * 10, 14 - squish * 5, 0, 0, 7); cx.fill();

    // 相方（左）
    const dep = this.handDepth(g, tv);
    cx.fillStyle = "#5aa9e6";
    cx.beginPath(); cx.roundRect(170, 250, 80, 110, 30); cx.fill();
    cx.fillStyle = "#ffd9b3";
    cx.beginPath(); cx.arc(210, 225, 34, 0, 7); cx.fill();
    cx.fillStyle = "#e0453a"; cx.fillRect(176, 205, 68, 10);
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(222, 225, 4, 0, 7); cx.arc(238, 225, 4, 0, 7); cx.fill();
    const hx = 270 + 108 * dep, hy = 300 - 8 * dep;
    cx.strokeStyle = "#ffd9b3"; cx.lineWidth = 14; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(235, 275); cx.lineTo(hx, hy); cx.stroke();
    cx.fillStyle = "#ffd9b3"; cx.beginPath(); cx.arc(hx, hy, 11, 0, 7); cx.fill();

    // プレイヤー（右）ときね
    cx.fillStyle = "#f28ab2";
    cx.beginPath(); cx.roundRect(560, 230, 70, 130, 30); cx.fill();
    cx.fillStyle = "#ffd9b3";
    cx.beginPath(); cx.arc(595, 200, 32, 0, 7); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(578, 198, 4, 0, 7); cx.arc(594, 198, 4, 0, 7); cx.fill();
    const a = 4.15 + (2.83 - 4.15) * swing, px = 548, py = 255, L = 130;
    const ex = px + Math.cos(a) * L, ey = py + Math.sin(a) * L;
    cx.strokeStyle = "#8a5a33"; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(px, py); cx.lineTo(ex, ey); cx.stroke();
    cx.save(); cx.translate(ex, ey); cx.rotate(a + Math.PI / 2);
    cx.fillStyle = "#b07a45"; cx.beginPath(); cx.roundRect(-28, -16, 56, 32, 8); cx.fill();
    cx.restore();
    cx.strokeStyle = "#ffd9b3"; cx.lineWidth = 12;
    cx.beginPath(); cx.moveTo(575, 260); cx.lineTo(px, py); cx.stroke();

    g.st.fx = g.st.fx.filter(f => tv - f.t < 0.4);
    for (const f of g.st.fx) {
      const e = (tv - f.t) / 0.4;
      cx.globalAlpha = 1 - e; cx.fillStyle = "#ffb300";
      star(360 - 30 * e, 270 - 30 * e, 9); star(440 + 30 * e, 270 - 30 * e, 9);
      cx.globalAlpha = 1;
    }

    if (tv - g.st.ouchAt < 0.6) bubble(210, 140, "いたっ！");
    for (const c of g.cues) {
      if (tv >= c.t && tv < c.t + 0.9) bubble(210, 140, c.type === "R" ? "ストップ" : "おおきく〜");
    }
    if (tv >= g.t0 + 4 * BEAT && tv < g.demoEnd) bubble(400, 70, "お手本：「ハイ」のあとに ぺったん");
  },
};

// ================= ゲーム4：ネジしめ工場 =================
// 部品が落ちた音から、小さい部品は1拍後・大きい部品は2拍後にしめる
const NEJI_PAT = {
  P1: [[0, "s"], [1, "s"], [2, "s"], [3, "s"]],
  P2: [[0, "b"], [2, "s"], [3, "s"]],
  P3: [[0, "s"], [1, "x"], [2, "s"], [3, "x"]],
  P4: [[0, "b"], [1, "b"], [3, "s"]],
  P5: [[0, "s"], [0.5, "s"], [2, "b"]],
  P6: [[0, "x"], [1, "s"], [1.5, "s"], [2, "b"]],
  P7: [[0, "b"], [0.5, "s"], [2, "s"], [2.5, "s"]],
};
const NEJI_SONG = ["P1", "P1", "P2", "P1", "P3", "P2", "P4", "P3", "P5", "P1",
                   "P6", "P4", "P7", "P5", "P6", "P7", "P3", "P1"];
const NEJI_DELAY = { s: 1, b: 2, x: 1 };
const NEJI_IN = 80, NEJI_ARM = 520;

const neji = {
  id: "neji",
  name: "ネジしめ工場",
  desc: "小さい部品が「カン」と落ちたら1拍後、大きい部品「ゴン」は2拍後にしめる。赤い部品「ブブー」はさわらない。",
  ops: "タップ / スペース",
  keys: 1,
  hasAvoid: true,
  comments: [
    "工場長に昇格。ラインが止まらない。",
    "いい仕事。大小の切りかえを詰めれば上へ。",
    "落ちた音から何拍後かを数えよう。",
    "目で部品を追うより、落ちた音を聞こう。",
  ],

  build(g) {
    g.parts = [];
    NEJI_SONG.forEach((p, i) => {
      const base = (i + 1) * 4;
      for (const [b, type] of NEJI_PAT[p]) {
        const dropBeat = base + b, beat = dropBeat + NEJI_DELAY[type];
        const part = { type, drop: g.t0 + dropBeat * BEAT, t: g.t0 + beat * BEAT };
        part.hit = { beat, t: part.t, key: null, j: null, avoid: type === "x", part };
        g.parts.push(part);
        g.hits.push(part.hit);
      }
    });
    g.hits.sort((a, b) => a.t - b.t);
    g.endBeat = Math.ceil((Math.max(...g.hits.map(h => h.beat)) + 1) / 4) * 4;
    g.st = { pressAt: -9, sparkAt: -9 };
  },

  schedule(g) {
    for (const p of g.parts) {
      if (p.type === "s") {
        tone(g.lead, p.drop, midi(84), "triangle", 0.12, 0.35);
        noise(g.lead, p.drop, 0.03, 0.2, "highpass", 4000);
      } else if (p.type === "b") {
        tone(g.lead, p.drop, midi(55), "triangle", 0.3, 0.5);
        tone(g.lead, p.drop, midi(62), "square", 0.15, 0.08);
      } else {
        tone(g.lead, p.drop, 140, "sawtooth", 0.1, 0.18);
        tone(g.lead, p.drop + 0.12, 140, "sawtooth", 0.12, 0.18);
      }
    }
  },

  onJudge(g, h, grade, tv, key, now) {
    g.st.pressAt = tv;
    if (grade === "wrong") {
      g.st.sparkAt = tv;
      tone(g.sfx, now, 110, "sawtooth", 0.35, 0.25);
      return;
    }
    const tones = CHORD_TONES[Math.floor(h.beat / 4) % 4];
    const f = midi(tones[2] + 12);
    const o = tone(g.lead, now, f * 0.8, "square", 0.12, 0.12);
    o.frequency.exponentialRampToValueAtTime(f, now + 0.08);
    noise(g.sfx, now, 0.05, 0.3, "bandpass", 2500, 3);
  },
  onWhiff(g, tv, key, now) { g.st.pressAt = tv; noise(g.sfx, now, 0.06, 0.25, "bandpass", 800, 2); },
  onMiss(g, h, now) { noise(g.sfx, now, 0.1, 0.25, "lowpass", 400); },

  drawPart(type, x, y, good, bad) {
    cx.save(); cx.translate(x, y);
    if (type === "s") {
      cx.fillStyle = bad ? "#999" : "#8fa3b5";
      cx.beginPath();
      for (let i = 0; i < 6; i++) cx.lineTo(Math.cos(i * Math.PI / 3) * 16, Math.sin(i * Math.PI / 3) * 16 - 16);
      cx.fill();
      cx.fillStyle = "#4e5d6c"; cx.beginPath(); cx.arc(0, -16, 6, 0, 7); cx.fill();
    } else if (type === "b") {
      cx.fillStyle = bad ? "#999" : "#5b7fa6";
      cx.beginPath(); cx.roundRect(-26, -40, 52, 40, 6); cx.fill();
      cx.fillStyle = "#c9d6e3"; cx.beginPath(); cx.arc(0, -20, 9, 0, 7); cx.fill();
    } else {
      cx.fillStyle = "#e05a4f";
      cx.beginPath(); cx.roundRect(-18, -34, 36, 34, 6); cx.fill();
      cx.strokeStyle = "#fff"; cx.lineWidth = 4;
      cx.beginPath(); cx.moveTo(-8, -25); cx.lineTo(8, -9); cx.moveTo(8, -25); cx.lineTo(-8, -9); cx.stroke();
    }
    if (good) {
      cx.strokeStyle = "#3fae5a"; cx.lineWidth = 5; cx.lineCap = "round";
      cx.beginPath(); cx.moveTo(-10, -58); cx.lineTo(-2, -50); cx.lineTo(12, -66); cx.stroke();
    }
    cx.restore();
  },

  draw(g, tv) {
    const bg = cx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#dfe7ee"); bg.addColorStop(1, "#c7d2dc");
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
    cx.fillStyle = "#eef4f9";
    for (const x of [60, 220, 640]) cx.fillRect(x, 40, 110, 70);

    // ベルトコンベア
    cx.fillStyle = "#4a4f57"; cx.fillRect(30, 300, 740, 22);
    cx.fillStyle = "#6b717b";
    const off = ((tv * 220) % 40 + 40) % 40;
    for (let x = 30 + off; x < 770; x += 40) cx.fillRect(x, 302, 18, 4);
    cx.fillStyle = "#333";
    for (let x = 50; x < 770; x += 70) { cx.beginPath(); cx.arc(x, 330, 8, 0, 7); cx.fill(); }

    // 部品
    for (const p of g.parts) {
      if (tv < p.drop - 0.25 || tv > p.t + 1.6) continue;
      let x, y = 300;
      if (tv < p.drop) { x = NEJI_IN; y = 300 - (p.drop - tv) / 0.25 * 160; }
      else if (tv < p.t) x = NEJI_IN + (NEJI_ARM - NEJI_IN) * (tv - p.drop) / (p.t - p.drop);
      else {
        x = NEJI_ARM + (tv - p.t) * 260;
        if (p.hit.j === "miss" && x > 770) continue;
      }
      if (x > 770) { y += Math.pow((x - 770) / 60, 2) * 40; }
      const good = p.hit.j && !["miss", "wrong", "pass"].includes(p.hit.j);
      this.drawPart(p.type, x, y, good, p.hit.j === "miss");
    }

    // しめる機械
    const k = tv - g.st.pressAt;
    const down = k >= 0 && k < 0.06 ? k / 0.06 : k >= 0.06 && k < 0.2 ? 1 - (k - 0.06) / 0.14 : 0;
    cx.fillStyle = "#f2b134";
    cx.beginPath(); cx.roundRect(NEJI_ARM - 55, 60, 110, 80, 12); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(NEJI_ARM - 20, 95, 6, 0, 7); cx.arc(NEJI_ARM + 20, 95, 6, 0, 7); cx.fill();
    const rodEnd = 200 + 70 * down;
    cx.fillStyle = "#9aa4ae"; cx.fillRect(NEJI_ARM - 8, 140, 16, rodEnd - 140);
    cx.fillStyle = "#555"; cx.beginPath(); cx.roundRect(NEJI_ARM - 22, rodEnd, 44, 18, 6); cx.fill();
    cx.fillStyle = "rgba(242,177,52,.35)"; cx.fillRect(NEJI_ARM - 30, 296, 60, 6);

    if (tv - g.st.sparkAt < 0.5) {
      cx.strokeStyle = "#ff5a3c"; cx.lineWidth = 3;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4, r = 20 + (tv - g.st.sparkAt) * 80;
        cx.beginPath(); cx.moveTo(NEJI_ARM + Math.cos(a) * 12, 280 + Math.sin(a) * 12);
        cx.lineTo(NEJI_ARM + Math.cos(a) * r, 280 + Math.sin(a) * r); cx.stroke();
      }
      bubble(NEJI_ARM, 30, "それはダメ！", 18);
    }
    cx.fillStyle = "#3a2a1a"; cx.font = "13px sans-serif"; cx.textAlign = "center";
    cx.fillText("小＝1拍後　大＝2拍後　赤＝さわらない", 400, 420);
  },
};

// ================= ゲーム5：おばけやしき =================
// ノックが聞こえた側のドアから、1拍後におばけが出る
const OBAKE_PAT = {
  G1: [[0, "L"], [2, "R"]],
  G2: [[0, "L"], [1, "R"], [2, "L"]],
  G3: [[0, "R"], [1, "R"], [2, "L"], [3, "L"]],
  G4: [[0, "L"], [0.5, "R"], [2, "R"], [2.5, "L"]],
  G5: [[0, "R"], [1, "L"], [1.5, "L"], [3, "R"]],
  G6: [[0, "L"], [0.5, "L"], [1, "R"], [1.5, "R"], [3, "L"]],
};
const OBAKE_SONG = ["G1", "G1", "G2", "G2", "G3", "G1", "G4", "G2", "G5", "G3", "G4", "G6", "G5", "G6", "G3", "G4"];
const OBAKE_DOOR = { L: 220, R: 580 };
const OBAKE_PITCH = { L: 74, R: 81 };

const obake = {
  id: "obake",
  name: "おばけやしき",
  desc: "ノックが<b>左右どちらから聞こえたか</b>を聞き分けて、1拍後に出てくるおばけをライトで照らす。イヤホン推奨。",
  ops: "F＝ひだり / J＝みぎ（画面の左右タップ）",
  keys: 2,
  comments: [
    "おばけも逃げ出す名探偵。",
    "よく聞けてる。続けて出るところを詰めれば上へ。",
    "左右の聞き分けはできてる。1拍後を意識しよう。",
    "ドアを見るより、ノックの方向を耳で。",
  ],

  build(g) {
    g.knocks = [];
    OBAKE_SONG.forEach((p, i) => {
      const base = (i + 1) * 4;
      for (const [b, side] of OBAKE_PAT[p]) {
        const kn = { side, t: g.t0 + (base + b) * BEAT };
        kn.hit = { beat: base + b + 1, t: kn.t + BEAT, key: side, j: null };
        g.knocks.push(kn);
        g.hits.push(kn.hit);
      }
    });
    g.hits.sort((a, b) => a.t - b.t);
    g.endBeat = Math.ceil((Math.max(...g.hits.map(h => h.beat)) + 1) / 4) * 4;
    g.st = { beam: { L: -9, R: -9 } };
  },

  schedule(g) {
    for (const k of g.knocks) {
      const d = panTo(g.lead, k.side === "L" ? -0.9 : 0.9);
      noise(d, k.t, 0.06, 0.7, "bandpass", 900, 2);
      tone(d, k.t, 170, "sine", 0.08, 0.6);
    }
  },

  onJudge(g, h, grade, tv, key, now) {
    g.st.beam[key] = tv;
    const d = panTo(g.lead, key === "L" ? -0.6 : 0.6);
    tone(d, now, midi(OBAKE_PITCH[key]), "square", 0.12, 0.12);
    if (grade === "wrong") tone(g.sfx, now, 120, "sawtooth", 0.2, 0.2);
    else noise(d, now, 0.06, 0.25, "highpass", 3000);
  },
  onWhiff(g, tv, key, now) {
    g.st.beam[key] = tv;
    tone(panTo(g.lead, key === "L" ? -0.6 : 0.6), now, midi(OBAKE_PITCH[key]), "square", 0.1, 0.08);
  },
  onMiss(g, h, now) {
    const o = tone(panTo(g.sfx, h.key === "L" ? -0.6 : 0.6), now, 300, "triangle", 0.3, 0.25);
    o.frequency.exponentialRampToValueAtTime(500, now + 0.25);
  },

  ghost(x, y, alpha, face) {
    cx.globalAlpha = alpha;
    cx.fillStyle = "#f4f1ff";
    cx.beginPath();
    cx.arc(x, y - 40, 38, Math.PI, 0);
    cx.lineTo(x + 38, y + 10);
    for (let i = 0; i < 4; i++) cx.quadraticCurveTo(x + 28 - i * 19, y + 22, x + 19 - i * 19, y + 10);
    cx.closePath(); cx.fill();
    cx.fillStyle = "#3a2a5a";
    if (face === "scared") {
      cx.font = "bold 16px sans-serif"; cx.textAlign = "center"; cx.fillText("> <", x, y - 36);
    } else {
      cx.beginPath(); cx.arc(x - 12, y - 42, 5, 0, 7); cx.arc(x + 12, y - 42, 5, 0, 7); cx.fill();
      cx.beginPath(); cx.ellipse(x, y - 22, 8, face === "laugh" ? 9 : 5, 0, 0, 7); cx.fill();
    }
    cx.globalAlpha = 1;
  },

  draw(g, tv) {
    const bg = cx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#2b2346"); bg.addColorStop(1, "#4a3b6b");
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
    cx.fillStyle = "#3a2f55"; cx.fillRect(0, 340, W, H - 340);

    for (const side of ["L", "R"]) {
      const x = OBAKE_DOOR[side];
      let shake = 0;
      for (const k of g.knocks) {
        if (k.side === side && tv - k.t >= 0 && tv - k.t < 0.15) shake = Math.sin((tv - k.t) * 120) * 4;
      }
      cx.fillStyle = "#6b4a3a";
      cx.beginPath(); cx.roundRect(x - 70 + shake, 150, 140, 190, [60, 60, 4, 4]); cx.fill();
      cx.fillStyle = "#1c1630";
      cx.beginPath(); cx.roundRect(x - 58 + shake, 162, 116, 178, [52, 52, 2, 2]); cx.fill();
      cx.fillStyle = "#d8b45a"; cx.beginPath(); cx.arc(x + 40 + shake, 260, 6, 0, 7); cx.fill();
    }

    // おばけ：1拍後に向けて少しずつ顔を出す
    for (const k of g.knocks) {
      const h = k.hit, x = OBAKE_DOOR[k.side], d = tv - h.t;
      if (d < -0.35 || d > 0.6) continue;
      const good = h.j && !["miss", "wrong"].includes(h.j);
      if (d < 0) this.ghost(x, 300 - 60 * (1 + d / 0.35), 0.25 + 0.75 * (1 + d / 0.35), null);
      else if (good) this.ghost(x, 240 - d * 120, Math.max(0, 1 - d / 0.4), "scared");
      else this.ghost(x, 240, Math.max(0, 1 - d / 0.6), h.j ? "laugh" : null);
      if (d >= 0 && d < 0.6 && (h.j === "miss" || h.j === "wrong")) bubble(x, 110, "ばあ〜", 18);
    }

    // ライトの光
    for (const side of ["L", "R"]) {
      const e = (tv - g.st.beam[side]) / 0.2;
      if (e < 0 || e > 1) continue;
      cx.fillStyle = `rgba(255,240,150,${0.45 * (1 - e)})`;
      cx.beginPath(); cx.moveTo(400, 395);
      cx.lineTo(OBAKE_DOOR[side] - 80, 170); cx.lineTo(OBAKE_DOOR[side] + 80, 170); cx.fill();
    }
    cx.fillStyle = "#ffcc4d"; cx.beginPath(); cx.roundRect(385, 380, 30, 50, 8); cx.fill();

    for (const [key, x, label] of [["L", 110, "ひだり（F）"], ["R", 450, "みぎ（J）"]]) {
      const flash = Math.max(0, 1 - (tv - g.st.beam[key]) / 0.15);
      cx.fillStyle = `rgba(255,255,255,${0.1 + flash * 0.3})`;
      cx.beginPath(); cx.roundRect(x, 375, 240, 60, 18); cx.fill();
      cx.fillStyle = "#f4f1ff"; cx.font = "bold 18px sans-serif"; cx.textAlign = "center";
      cx.fillText(label, x + 120, 411);
    }
  },
};

// ================= ゲーム6：ふうせんリレー =================
// お手本の長さで押しっぱなしにして、ぴったりで離す
const FUSEN_PAT = {
  b1: [[0, 2]],
  b2: [[0, 1], [2, 1]],
  b3: [[0, 3]],
  b4: [[1, 2]],
  b5: [[0, 1], [1.5, 2]],
  b6: [[0, 0.5], [1, 0.5], [2, 1.5]],
};
const FUSEN_SONG = ["b1", "b1", "b2", "b2", "b3", "b4", "b5", "b3", "b6", "b5", "b2", "b6"];
const FUSEN_COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc"];
const fusenR = beats => 12 + 22 * beats;

const fusen = {
  id: "fusen",
  name: "ふうせんリレー",
  desc: "相方がふくらませた風船と同じ長さで<b>押しっぱなし</b>にして、ぴったりで<b>離す</b>。押す瞬間も離す瞬間も判定。",
  ops: "長押し（タップ / スペース）",
  keys: 1,
  comments: [
    "風船職人。どれも同じ大きさ。",
    "いい感じ。離すタイミングを詰めれば上へ。",
    "押す瞬間はできてる。離す瞬間も音で数えよう。",
    "お手本の「キュッ」で離すのを聞いておこう。",
  ],

  build(g) {
    g.phrases = [];
    let bar = 1, ci = 0;
    for (const key of FUSEN_SONG) {
      const callBeat = bar * 4, ph = { callBeat, demo: [], pairs: [] };
      for (const [s, len] of FUSEN_PAT[key]) {
        const color = FUSEN_COLORS[ci++ % FUSEN_COLORS.length];
        ph.demo.push({ start: g.t0 + (callBeat + s) * BEAT, end: g.t0 + (callBeat + s + len) * BEAT, len, color });
        const down = { beat: callBeat + 4 + s, t: g.t0 + (callBeat + 4 + s) * BEAT, key: null, j: null, type: "down", len, color };
        const up = { beat: down.beat + len, t: down.t + len * BEAT, key: null, j: null, type: "up", down };
        down.up = up;
        ph.pairs.push(down);
        g.hits.push(down, up);
      }
      g.phrases.push(ph);
      bar += 2;
    }
    g.hits.sort((a, b) => a.t - b.t);
    g.endBeat = bar * 4;
    g.st = { cur: null, osc: null, items: [] };
  },

  blow(dest, t, dur) {
    const c = A.ctx, o = c.createOscillator(), gn = c.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(330, t);
    if (dur) o.frequency.linearRampToValueAtTime(330 * Math.pow(2, dur / BEAT / 2), t + dur);
    else o.frequency.linearRampToValueAtTime(330 * 4, t + 4 * BEAT);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    o.connect(gn).connect(dest);
    o.start(t);
    if (dur) { gn.gain.setValueAtTime(0.18, t + dur - 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.stop(t + dur + 0.02); }
    return { o, gn };
  },
  tie(dest, t) { tone(dest, t, 1400, "square", 0.05, 0.12); tone(dest, t + 0.05, 1800, "square", 0.05, 0.1); },

  schedule(g) {
    for (const ph of g.phrases) for (const d of ph.demo) {
      this.blow(g.lead, d.start, d.end - d.start);
      this.tie(g.lead, d.end);
    }
  },

  endBlow(g, now) {
    const b = g.st.osc;
    if (!b) return;
    b.gn.gain.cancelScheduledValues(now);
    b.gn.gain.setValueAtTime(0.18, now);
    b.gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
    b.o.stop(now + 0.05);
    g.st.osc = null;
  },

  finish(g, tv, state) {
    const c = g.st.cur;
    if (!c) return;
    c.state = state; c.endTv = tv; c.r = fusenR((tv - c.start) / BEAT);
    g.st.items.push(c);
    g.st.cur = null;
  },

  onJudge(g, h, grade, tv, key, now) {
    this.endBlow(g, now);
    g.st.cur = { start: tv, down: h, color: h.color };
    g.st.osc = this.blow(g.lead, now, 0);
  },
  onWhiff(g, tv, key, now) { noise(g.sfx, now, 0.08, 0.3, "lowpass", 600); },
  onRelease(g, tv, key, now, res) {
    if (!g.st.cur) return;
    this.endBlow(g, now);
    if (res && res.grade !== "early" && res.h === g.st.cur.down.up) {
      this.tie(g.lead, now);
      this.finish(g, tv, "tied");
    } else {
      const o = tone(g.sfx, now, 500, "sawtooth", 0.35, 0.08);
      o.frequency.exponentialRampToValueAtTime(120, now + 0.35);
      this.finish(g, tv, "deflate");
    }
  },
  onMiss(g, h, now) {
    if (h.type === "down") { h.up.j = "miss"; return; }
    // 離しそびれて割れた
    if (g.st.cur && g.st.cur.down === h.down) {
      this.endBlow(g, now);
      noise(g.sfx, now, 0.15, 0.9, "highpass", 1500);
      this.finish(g, now - latency(), "pop");
    }
  },

  balloon(x, y, r, color, alpha = 1) {
    cx.globalAlpha = alpha;
    cx.strokeStyle = "#7a6a5a"; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x, y + 40); cx.stroke();
    cx.fillStyle = color;
    cx.beginPath(); cx.ellipse(x, y - r, r * 0.9, r, 0, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.45)";
    cx.beginPath(); cx.ellipse(x - r * 0.35, y - r * 1.35, r * 0.18, r * 0.28, -0.5, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  },

  pumper(x, color, active, tv) {
    const pump = active ? Math.sin(tv * 30) * 8 : 0;
    cx.fillStyle = "#9aa4ae"; cx.fillRect(x - 12, 300, 24, 60);
    cx.strokeStyle = "#555"; cx.lineWidth = 6;
    cx.beginPath(); cx.moveTo(x, 300); cx.lineTo(x, 285 + pump); cx.moveTo(x - 18, 285 + pump); cx.lineTo(x + 18, 285 + pump); cx.stroke();
    cx.fillStyle = color;
    cx.beginPath(); cx.roundRect(x + 30, 260, 60, 100, 26); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(x + 52, 290, 4, 0, 7); cx.arc(x + 70, 290, 4, 0, 7); cx.fill();
  },

  draw(g, tv) {
    const sky = cx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#bfe3ff"); sky.addColorStop(1, "#eef8ff");
    cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
    cx.fillStyle = "#9bd77a"; cx.fillRect(0, 360, W, H - 360);
    cx.fillStyle = "#3a2a1a"; cx.font = "14px sans-serif"; cx.textAlign = "center";
    cx.fillText("お手本", 220, 400); cx.fillText("あなた", 580, 400);

    const cb = (tv - g.t0) / BEAT;
    const ph = g.phrases.find(p => cb >= p.callBeat - 0.5 && cb < p.callBeat + 8);
    let friendBlowing = false;

    if (ph) {
      // お手本の風船
      ph.demo.forEach((d, i) => {
        if (tv < d.start) return;
        if (tv < d.end) { friendBlowing = true; this.balloon(220, 300, fusenR((tv - d.start) / BEAT), d.color); }
        else this.balloon(110 + i * 55, 200, fusenR(d.len) * 0.6, d.color, 0.9);
      });
      // 目標の大きさ（点線）
      const next = ph.pairs.find(p => !p.up.j && tv > p.t - 0.6);
      if (next) {
        const r = fusenR(next.len);
        cx.setLineDash([6, 6]); cx.strokeStyle = "rgba(58,42,26,.45)"; cx.lineWidth = 2;
        cx.beginPath(); cx.ellipse(580, 300 - r, r * 0.9, r, 0, 0, 7); cx.stroke();
        cx.setLineDash([]);
      }
      cx.font = "bold 16px sans-serif"; cx.textAlign = "center";
      cx.fillStyle = cb >= ph.callBeat + 4 ? "#d88a00" : "#3c8a55";
      cx.fillText(cb >= ph.callBeat + 4 ? "あなたの番" : "よく見て聞いて", 400, 40);
    }

    this.pumper(220, "#5aa9e6", friendBlowing, tv);
    this.pumper(580, "#f28ab2", !!g.st.cur, tv);

    const c = g.st.cur;
    if (c) this.balloon(580, 300, fusenR((tv - c.start) / BEAT), c.color);

    g.st.items = g.st.items.filter(it => tv - it.endTv < 1.2);
    for (const it of g.st.items) {
      const e = tv - it.endTv;
      if (it.state === "tied") this.balloon(580 + e * 60, 300 - e * 200, it.r, it.color, Math.max(0, 1 - e / 1.2));
      else if (it.state === "deflate") this.balloon(580 + Math.sin(e * 40) * 30, 300 - e * 120, it.r * Math.max(0.1, 1 - e * 2), it.color, Math.max(0, 1 - e));
      else if (e < 0.4) {
        cx.strokeStyle = it.color; cx.lineWidth = 4;
        for (let i = 0; i < 10; i++) {
          const a = i * Math.PI / 5, r0 = it.r * 0.6, r1 = it.r * (0.8 + e * 2);
          cx.beginPath(); cx.moveTo(580 + Math.cos(a) * r0, 300 - it.r + Math.sin(a) * r0);
          cx.lineTo(580 + Math.cos(a) * r1, 300 - it.r + Math.sin(a) * r1); cx.stroke();
        }
        bubble(580, 90, "パーン！", 18);
      }
    }
  },
};

// ================= ゲーム7：だまって手拍子 =================
// 2拍目と4拍目に手拍子。途中で音も明かりも消えるが、テンポを保ったまま続ける
const DAMA_SONG = ["L", "L", "L", "L", "D", "L", "L", "L", "D", "D", "L", "L",
                   "D", "D", "L", "L", "D", "D", "D", "L", "L", "L"];

const damatte = {
  id: "damatte",
  name: "だまって手拍子",
  desc: "2拍目と4拍目に手拍子。「シーッ」の合図で音も明かりも消えるけど、<b>自分の中のテンポ</b>で続ける。",
  ops: "タップ / スペース",
  keys: 1,
  comments: [
    "体内メトロノーム搭載。暗闇でもずれない。",
    "いいキープ力。暗くなった後半を詰めれば上へ。",
    "明るいところは完ぺき。暗闇で走らないように。",
    "まずは明るいところで、スネアの音に手拍子を重ねよう。",
  ],

  build(g) {
    g.mute = new Set();
    g.dark = [];
    DAMA_SONG.forEach((type, i) => {
      const bar = i + 1, base = bar * 4;
      for (const off of [1, 3]) g.hits.push({ beat: base + off, t: g.t0 + (base + off) * BEAT, key: null, j: null });
      if (type === "D") {
        g.mute.add(bar);
        if (DAMA_SONG[i - 1] !== "D") {
          g.cues.push({ t: g.t0 + (base - 2) * BEAT });
          g.dark.push({ start: g.t0 + base * BEAT, end: 0, from: base });
        }
        const seg = g.dark[g.dark.length - 1];
        seg.end = g.t0 + (base + 4) * BEAT; seg.to = base + 4;
      }
    });
    g.endBeat = (DAMA_SONG.length + 1) * 4;
    g.st = { clapAt: -9 };
  },

  schedule(g) {
    for (const c of g.cues) noise(g.sfx, c.t, 0.7, 0.25, "highpass", 3500);
  },

  clap(g, now, beat) {
    noise(g.lead, now, 0.06, 0.6, "bandpass", 1600, 1.2);
    noise(g.lead, now + 0.01, 0.05, 0.4, "bandpass", 2600, 1.5);
    const tones = CHORD_TONES[Math.floor(beat / 4) % 4];
    tone(g.lead, now, midi(tones[0] + 12), "triangle", 0.12, 0.12);
  },
  onJudge(g, h, grade, tv, key, now) { this.clap(g, now, h.beat); g.st.clapAt = tv; },
  onWhiff(g, tv, key, now) { this.clap(g, now, (tv - g.t0) / BEAT); g.st.clapAt = tv; },
  onMiss() {},

  darkness(g, tv) {
    let a = 0;
    for (const s of g.dark) {
      if (tv >= s.start - 0.3 && tv < s.start) a = Math.max(a, (tv - (s.start - 0.3)) / 0.3);
      else if (tv >= s.start && tv < s.end) a = 1;
      else if (tv >= s.end && tv < s.end + 0.2) a = Math.max(a, 1 - (tv - s.end) / 0.2);
    }
    return a;
  },

  draw(g, tv) {
    cx.fillStyle = "#3b2340"; cx.fillRect(0, 0, W, H);
    cx.fillStyle = "#c0392b";
    cx.fillRect(0, 0, 90, 360); cx.fillRect(W - 90, 0, 90, 360);
    cx.fillStyle = "#8e5a3a"; cx.fillRect(0, 330, W, 40);
    const spot = cx.createRadialGradient(400, 260, 20, 400, 260, 220);
    spot.addColorStop(0, "rgba(255,240,190,.55)"); spot.addColorStop(1, "rgba(255,240,190,0)");
    cx.fillStyle = spot; cx.fillRect(150, 40, 500, 330);

    // 拍で揺れるランプ
    const cb = (tv - g.t0) / BEAT;
    const pulse = cb >= 0 ? Math.max(0, 1 - (cb % 1) * 3) : 0;
    cx.fillStyle = `rgba(255,210,90,${0.4 + 0.6 * pulse})`;
    cx.beginPath(); cx.arc(400, 70, 14 + 6 * pulse, 0, 7); cx.fill();

    // 演者
    const k = (tv - g.st.clapAt) / 0.15;
    const close = k >= 0 && k <= 1 ? 1 - k : 0;
    cx.fillStyle = "#ffcc4d";
    cx.beginPath(); cx.ellipse(400, 265, 48, 60, 0, 0, 7); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(385, 245, 5, 0, 7); cx.arc(415, 245, 5, 0, 7); cx.fill();
    cx.fillRect(392, 270, 16, 3);
    const hx = 46 - 34 * close;
    cx.fillStyle = "#ffe08a";
    cx.beginPath(); cx.arc(400 - hx, 300, 14, 0, 7); cx.arc(400 + hx, 300, 14, 0, 7); cx.fill();

    // 観客
    cx.fillStyle = "#1e1226";
    for (let x = 30; x < W; x += 70) { cx.beginPath(); cx.arc(x, 430, 30, Math.PI, 0); cx.fill(); }

    // 暗転
    const dk = this.darkness(g, tv);
    if (dk > 0) {
      cx.fillStyle = `rgba(5,3,8,${0.94 * dk})`; cx.fillRect(0, 0, W, H);
      if (close > 0) {
        cx.fillStyle = `rgba(255,230,140,${close})`;
        cx.beginPath(); cx.arc(400, 300, 22 + 10 * close, 0, 7); cx.fill();
      }
    }

    for (const c of g.cues) if (tv >= c.t && tv < c.t + 1) bubble(400, 150, "シーッ…");
    for (const s of g.dark) {
      if (tv >= s.end && tv < s.end + 1.2) {
        const seg = g.hits.filter(h => h.beat >= s.from && h.beat < s.to);
        const ok = seg.every(h => h.j && h.j !== "miss");
        bubble(400, 150, ok ? "おみごと！" : "ずれた〜");
      }
    }
  },
};

const GAMES = [nawa, mane, mochi, neji, obake, fusen, damatte];

// ================= エンジン =================
let G = null;
let offsetMs = 0;
try { offsetMs = Number(localStorage.getItem("rhythm.offset") ?? localStorage.getItem("nawa.offset")) || 0; } catch (e) {}

function stopGame() {
  if (G) G.bus.disconnect();
  G = null;
}

function startGame(game) {
  ensureAudio();
  stopGame();
  const c = A.ctx;
  const bus = c.createGain(); bus.gain.value = 0.9; bus.connect(c.destination);
  const music = c.createGain(); music.gain.value = 0.4; music.connect(bus);
  const lead = c.createGain(); lead.gain.value = 0.9; lead.connect(bus);
  const sfx = c.createGain(); sfx.gain.value = 1; sfx.connect(bus);
  const g = { game, bus, music, lead, sfx, t0: c.currentTime + 0.4,
              hits: [], cues: [], endBeat: 0, empty: 0, over: false, st: {} };
  game.build(g);
  g.tEnd = g.t0 + (g.endBeat + 3) * BEAT;
  scheduleBase(g);
  game.schedule(g);
  G = g;
  hide("title"); hide("result");
}

function press(key) {
  if (!G || G.over) return;
  const now = A.ctx.currentTime;
  const tv = now - latency();
  const tIn = tv - offsetMs / 1000;
  let best = null, bd = 9;
  for (const h of G.hits) {
    if (h.t - tIn > WIN.barely) break;
    if (h.j || h.type === "up") continue;
    const d = tIn - h.t;
    if (Math.abs(d) <= WIN.barely && Math.abs(d) < Math.abs(bd)) { best = h; bd = d; }
  }
  if (best) {
    const ad = Math.abs(bd);
    let grade = ad <= WIN.just ? "just" : ad <= WIN.ok ? "ok" : "barely";
    if ((best.key && key !== best.key) || best.avoid) grade = "wrong";
    best.j = grade;
    G.game.onJudge(G, best, grade, tv, key, now);
  } else {
    G.empty++;
    G.game.onWhiff(G, tv, key, now);
  }
}

function release(key) {
  if (!G || G.over) return;
  const now = A.ctx.currentTime;
  const tv = now - latency();
  const tIn = tv - offsetMs / 1000;
  let best = null, bd = 9;
  for (const h of G.hits) {
    if (h.t - tIn > WIN.barely) break;
    if (h.j || h.type !== "up") continue;
    const d = tIn - h.t;
    if (Math.abs(d) <= WIN.barely && Math.abs(d) < Math.abs(bd)) { best = h; bd = d; }
  }
  let res = null;
  if (best) {
    const ad = Math.abs(bd);
    best.j = ad <= WIN.just ? "just" : ad <= WIN.ok ? "ok" : "barely";
    res = { h: best, grade: best.j };
  } else {
    // 早く離しすぎた
    const early = G.hits.find(h => h.type === "up" && !h.j && h.down && h.down.j && h.down.t <= tIn && h.t > tIn);
    if (early) { early.j = "miss"; res = { h: early, grade: "early" }; }
  }
  if (G.game.onRelease) G.game.onRelease(G, tv, key, now, res);
}

function update() {
  if (!G || G.over) return;
  const now = A.ctx.currentTime;
  const tIn = now - latency() - offsetMs / 1000;
  for (const h of G.hits) {
    if (h.t - tIn > 0) break;
    if (!h.j && tIn - h.t > WIN.barely) {
      if (h.avoid) { h.j = "pass"; continue; }
      h.j = "miss";
      G.game.onMiss(G, h, now);
    }
  }
  if (now > G.tEnd) endGame();
}

function bestKey(game) { return `${game.id}.best`; }
function getBest(game) {
  try { return Number(localStorage.getItem(bestKey(game))) || 0; } catch (e) { return 0; }
}

function endGame() {
  G.over = true;
  const game = G.game, n = G.hits.filter(h => !h.avoid).length;
  const cnt = { just: 0, ok: 0, barely: 0, wrong: 0, miss: 0, pass: 0 };
  let touched = 0;
  for (const h of G.hits) {
    cnt[h.j || "miss"]++;
    if (h.avoid && h.j === "wrong") touched++;
  }
  const raw = (cnt.just + cnt.ok * 0.8 + cnt.barely * 0.5) / n * 100 - G.empty - touched * 5;
  const score = Math.max(0, Math.round(raw));
  const lv = score >= 90 ? 0 : score >= 75 ? 1 : score >= 55 ? 2 : 3;
  $("rank").textContent = ["かんぺき！", "いいかんじ", "まあまあ", "もういっかい"][lv];
  $("comment").textContent = `${game.name}　スコア ${score} 点 ― ${game.comments[lv]}`;
  const rows = [["ジャスト", cnt.just], ["OK", cnt.ok], ["ぎりぎり", cnt.barely]];
  if (game.keys === 2) rows.push(["ちがう音", cnt.wrong]);
  if (game.hasAvoid) rows.push(["さわっちゃった", touched]);
  rows.push(["ミス", cnt.miss], ["からぶり", G.empty]);
  $("detail").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  try { if (score > getBest(game)) localStorage.setItem(bestKey(game), String(score)); } catch (e) {}
  renderStages();
  show("result");
}

function draw() {
  update();
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#fff6e0"; cx.fillRect(0, 0, cv.width, cv.height);
  if (G) {
    cx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
    G.game.draw(G, A.ctx.currentTime - latency());
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ================= UI =================
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }

function renderStages() {
  const box = $("stages");
  box.innerHTML = "";
  for (const game of GAMES) {
    const card = document.createElement("div");
    card.className = "card";
    const best = getBest(game);
    card.innerHTML = `<h3>${game.name}</h3><p>${game.desc}</p><p>操作：${game.ops}</p>
      <div class="meta"><span>${best ? `ベスト ${best} 点` : "まだ遊んでいない"}</span><button>あそぶ</button></div>`;
    card.querySelector("button").addEventListener("click", () => startGame(game));
    box.appendChild(card);
  }
}

$("offset").value = offsetMs;
$("offVal").textContent = offsetMs;
$("offset").addEventListener("input", e => {
  offsetMs = Number(e.target.value);
  $("offVal").textContent = offsetMs;
  try { localStorage.setItem("rhythm.offset", String(offsetMs)); } catch (e2) {}
});
$("retryBtn").addEventListener("click", () => startGame(G.game));
$("backBtn").addEventListener("click", () => { stopGame(); hide("result"); show("title"); });
renderStages();

const KEYS_ONE = ["Space", "Enter", "ArrowUp", "KeyZ", "KeyX", "KeyF", "KeyJ"];
const KEYS_TWO = { KeyF: "L", KeyD: "L", ArrowLeft: "L", KeyZ: "L", KeyJ: "R", KeyK: "R", ArrowRight: "R", KeyX: "R" };

addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Escape" && G) { stopGame(); hide("result"); show("title"); return; }
  if (!G || G.over) return;
  if (G.game.keys === 2) {
    if (KEYS_TWO[e.code]) { e.preventDefault(); press(KEYS_TWO[e.code]); }
  } else if (KEYS_ONE.includes(e.code)) {
    e.preventDefault(); press("A");
  }
});
addEventListener("keyup", e => {
  if (!G || G.over) return;
  if (G.game.keys === 2) { if (KEYS_TWO[e.code]) release(KEYS_TWO[e.code]); }
  else if (KEYS_ONE.includes(e.code)) release("A");
});
let pointerKey = null;
const onPointerUp = () => { if (pointerKey) { release(pointerKey); pointerKey = null; } };
addEventListener("pointerup", onPointerUp);
addEventListener("pointercancel", onPointerUp);
addEventListener("pointerdown", e => {
  if (e.target.closest("button, input, label, .overlay")) return;
  if (!G || G.over) return;
  e.preventDefault();
  pointerKey = G.game.keys === 2 ? (e.clientX < innerWidth / 2 ? "L" : "R") : "A";
  press(pointerKey);
});
</script>
</body>
</html>
