<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>リズムあそび</title>
<style>
  :root { --bg:#fff6e0; --ink:#3a2a1a; --accent:#ff7a59; --sub:#7a6a5a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;
    overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(255,246,224,.96); text-align:center; padding:16px;
    box-sizing:border-box; overflow-y:auto; }
  .hidden { display:none; }
  h1 { margin:0; font-size:clamp(28px,7vw,44px); letter-spacing:.05em; }
  h2 { margin:0; font-size:clamp(32px,9vw,64px); }
  p { margin:0; line-height:1.7; }
  .how { max-width:560px; font-size:15px; color:var(--sub); }
  .how b { color:var(--ink); }
  button { font:inherit; font-size:20px; padding:12px 32px; border-radius:999px; border:3px solid var(--ink);
    background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:#fff; color:var(--ink); font-size:16px; padding:8px 22px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .stages { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:760px; }
  .card { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:14px 16px; width:300px;
    max-width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .card h3 { margin:0; font-size:20px; }
  .card p { font-size:14px; color:var(--sub); line-height:1.6; }
  .card .meta { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); }
  .card button { font-size:16px; padding:6px 22px; }
  .offset { font-size:13px; color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .offset input { width:240px; }
  table { border-collapse:collapse; font-size:16px; }
  td { padding:2px 12px; }
  td:last-child { text-align:right; font-weight:bold; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="overlay">
  <h1>リズムあそび</h1>
  <p class="how">ベースで拍をとって、リードに合わせて遊ぶ。<b>目で追うより、音を聞いてノる</b>のがコツ。</p>
  <div id="stages" class="stages"></div>
  <label class="offset">
    <span>タイミング補正：<span id="offVal">0</span> ms（入力がいつも遅れると判定される場合は＋側へ）</span>
    <input id="offset" type="range" min="-100" max="150" step="5" value="0">
  </label>
  <p class="how">プレイ中に Esc でやめる</p>
</div>

<div id="result" class="overlay hidden">
  <h2 id="rank"></h2>
  <p id="comment"></p>
  <table id="detail"></table>
  <div class="row">
    <button id="retryBtn">もういちど</button>
    <button id="backBtn" class="sub">ゲームをえらぶ</button>
  </div>
</div>

<script>
"use strict";

// ================= 共通設定 =================
const BPM = 120;
const BEAT = 60 / BPM;
const WIN = { just: 0.045, ok: 0.09, barely: 0.15 }; // 判定幅（秒）
const W = 800, H = 450, GROUND = 380;

// ================= オーディオ =================
const A = { ctx: null, noise: null };

function ensureAudio() {
  if (!A.ctx) {
    A.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    const len = A.ctx.sampleRate;
    A.noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    const d = A.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (A.ctx.state === "suspended") A.ctx.resume();
}

function latency() {
  const c = A.ctx;
  return c.outputLatency || c.baseLatency || 0;
}

function env(g, t, a, peak, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}

function tone(dest, t, freq, type, dur, vol, a = 0.005) {
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  env(g, t, a, vol, dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + a + dur + 0.05);
  return o;
}

function noise(dest, t, dur, vol, ftype, freq, q = 1) {
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.noise;
  f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  env(g, t, 0.002, vol, dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

const SND = {
  kick(d, t) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    env(g, t, 0.002, 0.9, 0.25);
    o.connect(g).connect(d); o.start(t); o.stop(t + 0.35);
  },
  snare(d, t) { noise(d, t, 0.15, 0.45, "bandpass", 1800, 0.8); tone(d, t, 190, "triangle", 0.08, 0.25); },
  hat(d, t, v = 0.15) { noise(d, t, 0.04, v, "highpass", 8000); },
  crash(d, t) { noise(d, t, 1.4, 0.35, "highpass", 5000); },
  block(d, t, hi) { tone(d, t, hi ? 1600 : 1100, "sine", 0.07, 0.6); },
  miss(d, t) {
    const o = tone(d, t, 220, "sawtooth", 0.3, 0.25);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
    noise(d, t, 0.12, 0.5, "lowpass", 400);
  },
  whiff(d, t) { noise(d, t, 0.08, 0.15, "bandpass", 1200, 3); },
};

// ベース（土台）：C - Am - F - G を4分音符で刻むだけ。メロディは持たない
const ROOTS = [0, 9, 5, 7];

function scheduleBase(g) {
  const { music, sfx, t0, endBeat } = g;
  const bt = b => t0 + b * BEAT;
  for (let b = 0; b < 4; b++) SND.block(sfx, bt(b), b === 3); // カウントイン
  for (let b = 0; b < endBeat; b++) {
    const inBar = b % 4, bar = Math.floor(b / 4);
    SND.hat(music, bt(b), 0.12);
    if (b < 4) continue;
    if (inBar === 0 || inBar === 2) SND.kick(music, bt(b));
    if (inBar === 1 || inBar === 3) SND.snare(music, bt(b));
    tone(music, bt(b), midi(36 + ROOTS[bar % 4]), "triangle", 0.35, 0.5);
  }
  const tEnd = bt(endBeat);
  SND.kick(music, tEnd); SND.crash(music, tEnd);
  for (const n of [48, 60, 64, 67, 72]) tone(music, tEnd, midi(n), "triangle", 1.2, 0.18);
}

// ================= 描画の共通部品 =================
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let view = { s: 1, ox: 0, oy: 0 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const s = Math.min(innerWidth / W, innerHeight / H);
  view = { s: s * dpr, ox: (innerWidth - W * s) / 2 * dpr, oy: (innerHeight - H * s) / 2 * dpr };
}
addEventListener("resize", resize);
resize();

function star(x, y, r) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  cx.fill();
}

function bubble(x, y, text, size = 22) {
  cx.font = `bold ${size}px sans-serif`; cx.textAlign = "center";
  const w = cx.measureText(text).width + 28;
  cx.fillStyle = "#fff"; cx.strokeStyle = "#3a2a1a"; cx.lineWidth = 3;
  cx.beginPath(); cx.roundRect(x - w / 2, y - size, w, size * 1.8, 14); cx.fill(); cx.stroke();
  cx.fillStyle = "#3a2a1a"; cx.fillText(text, x, y + size * 0.3);
}

// ================= ゲーム1：なわとび =================
// 譜面：前のジャンプから次のジャンプまでの拍数（1=通常, 2=ゆっくり, 0.5=すばやく）
const NAWA_BAR = {
  A:  [1, 1, 1, 1],
  M:  [2, 1, 1],
  S:  [2, 2],
  F:  [1, 1, 0.5, 0.5, 1],
  F2: [0.5, 0.5, 1, 0.5, 0.5, 1],
};
const NAWA_SONG = ["A","A","A","A", "M","A","M","A", "F","A","F","A",
                   "S","A","M","F", "F2","A","F2","M", "F","F2","S","A", "A"];
// リード：ジャンプのタイミングでだけ鳴る。和音の構成音から選ぶ
const CHORD_TONES = [[60, 64, 67, 72], [57, 60, 64, 69], [57, 60, 65, 69], [55, 59, 62, 67]];
const LEAD_STEP = [0, 1, 2, 3, 3, 2, 1, 2];

const nawa = {
  id: "nawa",
  name: "ぴょんぴょん なわとび",
  desc: "なわが地面に当たる瞬間にジャンプ。「ゆっくり〜」「タタッ！」の合図でリズムが変わる。",
  ops: "タップ / スペース",
  keys: 1,
  comments: [
    "なわとび名人。もう縄が止まって見える。",
    "リズムに乗れてる。合図のところを詰めれば上へ。",
    "跳べてはいる。画面より音に集中してみよう。",
    "目で追うと間に合わない。耳で跳ぼう。",
  ],

  build(g) {
    let b = 3; // 最初のジャンプは4拍目（カウントイン直後）
    for (const iv of NAWA_SONG.flatMap(k => NAWA_BAR[k])) {
      b += iv;
      g.hits.push({ beat: b, t: g.t0 + b * BEAT, iv, key: null, j: null });
    }
    g.hits.forEach((h, i) => {
      const prevIv = i > 0 ? g.hits[i - 1].iv : 1;
      if (h.iv !== 1 && h.iv !== prevIv) {
        g.cues.push({ t: g.t0 + (h.beat - h.iv - 1) * BEAT, type: h.iv > 1 ? "slow" : "fast" });
      }
    });
    g.endBeat = Math.ceil((b + 1) / 4) * 4;
    g.st = { jumpAt: -9, kind: null, tripAt: -9, fx: [] };
  },

  leadNote(h) {
    const tones = CHORD_TONES[Math.floor(h.beat / 4) % 4];
    if (h.iv > 1) return tones[0] - 12;
    return tones[LEAD_STEP[Math.floor((h.beat % 4) * 2)]] + (h.iv < 1 ? 12 : 0);
  },

  schedule(g) {
    // リード：変則リズムがそのまま旋律として聞こえる
    for (const h of g.hits) {
      const n = this.leadNote(h), dur = h.iv > 1 ? 0.7 : h.iv < 1 ? 0.12 : 0.25;
      tone(g.lead, h.t, midi(n), "square", dur, 0.16);
      tone(g.lead, h.t, midi(n + 12), "triangle", dur * 0.6, 0.08);
    }
    for (const c of g.cues) {
      if (c.type === "slow") {
        tone(g.sfx, c.t, midi(67), "triangle", 0.18, 0.7);
        tone(g.sfx, c.t + 0.2, midi(60), "triangle", 0.45, 0.7);
      } else {
        tone(g.sfx, c.t, 1250, "square", 0.05, 0.25);
        tone(g.sfx, c.t + BEAT / 2, 1250, "square", 0.05, 0.25);
      }
    }
  },

  onJudge(g, h, grade, tv, key, now) {
    noise(g.sfx, now, 0.05, 0.5, "bandpass", 3000, 2); // なわの「パシッ」
    if (grade === "barely") tone(g.sfx, now, 300, "sawtooth", 0.06, 0.08);
    const s = g.st;
    s.jumpAt = tv; s.kind = grade;
    if (grade === "just") s.fx.push({ t: tv, type: "star" });
    if (grade === "barely") s.fx.push({ t: tv, type: "sweat" });
  },
  onWhiff(g, tv, key, now) { SND.whiff(g.sfx, now); g.st.jumpAt = tv; g.st.kind = "whiff"; },
  onMiss(g, h, now) { SND.miss(g.sfx, now); g.st.tripAt = h.t; },

  ropePhase(g, tv) {
    const hs = g.hits;
    let prev = hs[0].t - hs[0].iv * BEAT;
    if (tv < prev + 0.5 * (hs[0].t - prev)) return 0.5;
    for (const h of hs) {
      if (tv < h.t) return (tv - prev) / (h.t - prev);
      prev = h.t;
    }
    const p = (tv - prev) / BEAT;
    return p < 0.5 ? p : 0.5;
  },

  turner(x, y, w, h, color, flip, phase) {
    cx.fillStyle = color;
    cx.beginPath(); cx.roundRect(x - w / 2, y - h, w, h, w / 2); cx.fill();
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(x - 9 * flip + 6 * flip, y - h + 32, 4, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(x + 9 * flip + 6 * flip, y - h + 32, 4, 0, 7); cx.fill();
    cx.fillRect(x - 6 + 6 * flip, y - h + 46, 12, 3);
    const a = phase * Math.PI * 2;
    const hand = { x: x + 50 * flip + Math.sin(a) * 10 * flip, y: 232 + Math.cos(a) * 12 };
    cx.strokeStyle = color; cx.lineWidth = 10; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(x + 15 * flip, y - h + 80); cx.lineTo(hand.x, hand.y); cx.stroke();
    return hand;
  },

  rope(l, r, phase, front) {
    const cy = 287.5 + 357.5 * Math.cos(phase * Math.PI * 2);
    cx.strokeStyle = "#7a3e1c"; cx.lineWidth = front ? 5 : 3;
    cx.beginPath(); cx.moveTo(l.x, l.y); cx.quadraticCurveTo(400, cy, r.x, r.y); cx.stroke();
  },

  groundCue(g, tv, phase) {
    // なわの影：地面に近づくほど濃く、小さく集まる
    const near = (Math.cos(phase * Math.PI * 2) + 1) / 2;
    cx.fillStyle = `rgba(90,50,20,${0.08 + 0.32 * near * near})`;
    cx.beginPath(); cx.ellipse(400, GROUND + 14, 260 - 170 * near, 5 + 4 * near, 0, 0, 7); cx.fill();
    // 地面に当たった瞬間の土ぼこり
    let hit = null;
    for (const h of g.hits) {
      const d = tv - h.t;
      if (d < -1) break;
      if (d >= 0 && d < 0.25) hit = h;
    }
    if (!hit) return;
    const e = (tv - hit.t) / 0.25;
    cx.fillStyle = `rgba(140,110,70,${0.6 * (1 - e)})`;
    for (const dx of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        cx.beginPath();
        cx.arc(400 + dx * (60 + 70 * e + i * 18), GROUND + 6 - 18 * e - i * 6, 7 - i * 1.5, 0, 7);
        cx.fill();
      }
    }
  },

  player(g, tv) {
    const p = g.st;
    let lift = 0, tilt = 0;
    const dur = p.kind === "whiff" ? 0.25 : 0.38;
    const k = (tv - p.jumpAt) / dur;
    if (k >= 0 && k <= 1) lift = (p.kind === "whiff" ? 45 : 110) * Math.sin(Math.PI * k);
    const tk = (tv - p.tripAt) / 0.6;
    const tripping = tk >= 0 && tk <= 1;
    if (tripping) { tilt = Math.sin(tk * Math.PI) * 0.6; lift = 0; }

    cx.fillStyle = "rgba(0,0,0,.15)";
    cx.beginPath(); cx.ellipse(400, GROUND + 4, 34 - lift * 0.12, 8, 0, 0, 7); cx.fill();

    cx.save();
    cx.translate(400, GROUND - lift);
    cx.rotate(tilt);
    cx.strokeStyle = "#3a2a1a"; cx.lineWidth = 6; cx.lineCap = "round";
    const spread = lift > 10 ? 14 : 8;
    cx.beginPath(); cx.moveTo(-10, -24); cx.lineTo(-spread, 0); cx.moveTo(10, -24); cx.lineTo(spread, 0); cx.stroke();
    cx.fillStyle = "#ffcc4d";
    cx.beginPath(); cx.ellipse(0, -58, 32, 38, 0, 0, 7); cx.fill();
    cx.fillStyle = "#3a2a1a";
    if (tripping) {
      cx.font = "bold 18px sans-serif"; cx.textAlign = "center";
      cx.fillText("× ×", 0, -60);
    } else {
      cx.beginPath(); cx.arc(-11, -64, 4.5, 0, 7); cx.arc(11, -64, 4.5, 0, 7); cx.fill();
      cx.beginPath();
      if (lift > 10) cx.arc(0, -48, 7, 0, Math.PI); else cx.rect(-6, -48, 12, 3);
      cx.fill();
    }
    cx.fillStyle = "rgba(255,120,120,.5)";
    cx.beginPath(); cx.arc(-21, -52, 5, 0, 7); cx.arc(21, -52, 5, 0, 7); cx.fill();
    cx.restore();

    if (tripping) {
      cx.fillStyle = "#3a2a1a"; cx.font = "bold 22px sans-serif"; cx.textAlign = "center";
      cx.fillText("いてっ", 400, GROUND - 120);
    }
    p.fx = p.fx.filter(f => tv - f.t < 0.5);
    for (const f of p.fx) {
      const e = (tv - f.t) / 0.5;
      cx.globalAlpha = 1 - e;
      if (f.type === "star") {
        cx.fillStyle = "#ffb300";
        for (const dx of [-40, 40]) star(400 + dx * (1 + e), GROUND - 20 - 30 * e, 8);
      } else {
        cx.fillStyle = "#4aa3df";
        cx.beginPath(); cx.arc(440, GROUND - 110 + 20 * e, 6, 0, 7); cx.fill();
      }
      cx.globalAlpha = 1;
    }
  },

  draw(g, tv) {
    const sky = cx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#ffe2a8"); sky.addColorStop(1, "#fff6e0");
    cx.fillStyle = sky; cx.fillRect(0, 0, W, GROUND);
    cx.fillStyle = "#ffd36b"; cx.beginPath(); cx.arc(680, 80, 40, 0, 7); cx.fill();
    cx.fillStyle = "#8fd16a"; cx.fillRect(0, GROUND, W, H - GROUND);

    const phase = this.ropePhase(g, tv);
    const back = Math.cos(phase * Math.PI * 2) < 0;
    const l = this.turner(120, GROUND, 64, 160, "#5aa9e6", 1, phase);
    const r = this.turner(680, GROUND, 64, 160, "#f28ab2", -1, phase);
    this.groundCue(g, tv, phase);
    if (back) this.rope(l, r, phase, false);
    this.player(g, tv);
    if (!back) this.rope(l, r, phase, true);

    for (const c of g.cues) {
      if (tv >= c.t && tv < c.t + 0.9) {
        if (c.type === "slow") bubble(140, 170, "ゆっくり〜");
        else bubble(660, 170, "タタッ！");
      }
    }
  },
};

// ================= ゲーム2：まねっこ小鳥 =================
// お手本1小節 → まねっこ1小節。[小節内の拍, "L"=ひくい / "R"=たかい]
const MANE_PHRASES = {
  p1: [[0, "L"], [1, "L"], [2, "L"]],
  p2: [[0, "L"], [1, "R"], [2, "L"]],
  p3: [[0, "R"], [1, "R"], [2, "L"], [3, "L"]],
  p4: [[0, "L"], [0.5, "L"], [1, "R"], [2, "R"]],
  p5: [[0, "R"], [1, "L"], [1.5, "L"], [2, "R"]],
  p6: [[0, "L"], [0.5, "R"], [1, "L"], [2, "R"], [2.5, "R"]],
  p7: [[0, "L"], [1.5, "R"], [2, "R"], [3, "L"]],
  p8: [[0, "R"], [0.5, "R"], [1, "R"], [2, "L"], [2.5, "L"], [3, "L"]],
};
const MANE_SONG = ["p1", "p1", "p2", "p2", "p3", "p4", "p5", "p4", "p6", "p7", "p8", "p6"];
const MANE_PITCH = { L: 72, R: 79 };

const mane = {
  id: "mane",
  name: "まねっこ小鳥",
  desc: "先生の歌を聞いて、次の小節で同じように歌い返す。ひくい音とたかい音を使い分ける。",
  ops: "F＝ひくい / J＝たかい（画面の左右タップ）",
  keys: 2,
  comments: [
    "完コピ。先生もびっくり。",
    "よく聞けてる。高い・低いの切りかえを詰めれば上へ。",
    "リズムは取れてる。音の高さまで聞き分けよう。",
    "まずは先生の歌を最後まで聞くことから。",
  ],

  build(g) {
    g.phrases = [];
    let bar = 1;
    for (const key of MANE_SONG) {
      const callBeat = bar * 4;
      const notes = MANE_PHRASES[key].map(([b, k]) => ({ b, key: k, t: g.t0 + (callBeat + b) * BEAT }));
      const hits = notes.map(n => ({ beat: callBeat + 4 + n.b, t: n.t + 4 * BEAT, key: n.key, j: null }));
      g.phrases.push({ callBeat, notes, hits });
      g.hits.push(...hits);
      bar += 2;
    }
    g.endBeat = bar * 4;
    g.st = { pressAt: -9, pressKey: null, badAt: -9, goodAt: -9, pad: { L: -9, R: -9 } };
  },

  chirp(dest, t, key, teacher) {
    const f = midi(MANE_PITCH[key]);
    const o = tone(dest, t, f * 1.08, "square", 0.16, teacher ? 0.14 : 0.12);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    tone(dest, t, f * 2, "triangle", 0.1, teacher ? 0.05 : 0.08);
  },

  schedule(g) {
    for (const p of g.phrases) for (const n of p.notes) this.chirp(g.lead, n.t, n.key, true);
  },

  onPress(g, tv, key, now) {
    // プレイヤーが押した音がそのままリードになる
    this.chirp(g.lead, now, key, false);
    g.st.pressAt = tv; g.st.pressKey = key; g.st.pad[key] = tv;
  },
  onJudge(g, h, grade, tv, key, now) {
    this.onPress(g, tv, key, now);
    if (grade === "wrong") g.st.badAt = tv; else g.st.goodAt = tv;
  },
  onWhiff(g, tv, key, now) { this.onPress(g, tv, key, now); g.st.badAt = tv; },
  onMiss(g, h, now) { noise(g.sfx, now, 0.1, 0.25, "lowpass", 500); g.st.badAt = h.t; },

  bird(x, y, r, color, belly, flip, open, mood) {
    cx.save();
    cx.translate(x, y);
    cx.scale(flip, 1);
    // しっぽ
    cx.fillStyle = color;
    cx.beginPath(); cx.moveTo(-r * 0.8, -r * 0.2); cx.lineTo(-r * 1.5, -r * 0.6); cx.lineTo(-r * 1.4, r * 0.1); cx.fill();
    // からだ
    cx.beginPath(); cx.arc(0, -r, r, 0, 7); cx.fill();
    cx.fillStyle = belly;
    cx.beginPath(); cx.ellipse(r * 0.2, -r * 0.7, r * 0.6, r * 0.5, 0, 0, 7); cx.fill();
    // つばさ
    cx.fillStyle = "rgba(0,0,0,.12)";
    cx.beginPath(); cx.ellipse(-r * 0.2, -r * 0.8, r * 0.5, r * 0.32, open ? -0.6 : -0.2, 0, 7); cx.fill();
    // め
    cx.fillStyle = "#3a2a1a";
    cx.beginPath(); cx.arc(r * 0.35, -r * 1.3, r * 0.1, 0, 7); cx.fill();
    // くちばし
    cx.fillStyle = "#ff9a3c";
    const bx = r * 0.85, by = -r * 1.1, bl = r * 0.45, gap = open ? r * 0.22 : 0;
    cx.beginPath(); cx.moveTo(bx, by - r * 0.15); cx.lineTo(bx + bl, by - gap * 0.5); cx.lineTo(bx, by); cx.fill();
    cx.beginPath(); cx.moveTo(bx, by + r * 0.02); cx.lineTo(bx + bl * 0.8, by + gap); cx.lineTo(bx, by + r * 0.15); cx.fill();
    // ほっぺ
    cx.fillStyle = "rgba(255,120,120,.45)";
    cx.beginPath(); cx.arc(r * 0.3, -r * 0.95, r * 0.12, 0, 7); cx.fill();
    // あし
    cx.strokeStyle = "#ff9a3c"; cx.lineWidth = 4; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-r * 0.2, -r * 0.05); cx.lineTo(-r * 0.25, 8); cx.moveTo(r * 0.2, -r * 0.05); cx.lineTo(r * 0.25, 8); cx.stroke();
    cx.restore();
    if (mood === "sad") {
      cx.fillStyle = "#4aa3df";
      cx.beginPath(); cx.arc(x + r * 0.9 * -flip, y - r * 1.8, 6, 0, 7); cx.fill();
    }
    if (mood === "happy") {
      cx.fillStyle = "#ffb300";
      star(x + r * 1.1 * -flip, y - r * 2, 9);
    }
  },

  draw(g, tv) {
    const sky = cx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#cfeeff"); sky.addColorStop(1, "#f4fbff");
    cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
    // 枝
    cx.strokeStyle = "#8a5a33"; cx.lineWidth = 16; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-20, 318); cx.quadraticCurveTo(400, 300, 820, 322); cx.stroke();
    cx.fillStyle = "#7cc56b";
    for (const [lx, ly] of [[80, 300], [330, 296], [500, 298], [740, 304]]) {
      cx.beginPath(); cx.ellipse(lx, ly, 22, 10, -0.4, 0, 7); cx.fill();
    }

    const cb = (tv - g.t0) / BEAT; // いま何拍目か
    const ph = g.phrases.find(p => cb >= p.callBeat - 0.5 && cb < p.callBeat + 7.75);
    const inResp = ph && cb >= ph.callBeat + 4;
    const bob = cb >= 0 && cb < g.endBeat ? -5 * Math.max(0, 1 - (cb % 1) * 4) : 0;

    // 歌のパネル：歌った音が段に並ぶ（上=たかい / 下=ひくい）
    const PX = 200, STEP = 120, RY = { R: 82, L: 138 };
    cx.fillStyle = "rgba(255,255,255,.75)";
    cx.beginPath(); cx.roundRect(120, 30, 560, 165, 18); cx.fill();
    cx.font = "13px sans-serif"; cx.textAlign = "left"; cx.fillStyle = "#7a6a5a";
    cx.fillText("たかい", 132, RY.R + 5); cx.fillText("ひくい", 132, RY.L + 5);
    for (let i = 0; i < 4; i++) {
      const x = PX + i * STEP;
      cx.strokeStyle = "rgba(58,42,26,.12)"; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(x, 55); cx.lineTo(x, 162); cx.stroke();
      // 拍の目印
      const lit = ph && Math.floor(cb) % 4 === i && cb >= ph.callBeat;
      cx.fillStyle = lit ? (inResp ? "#ffb300" : "#4fae6c") : "rgba(58,42,26,.15)";
      cx.beginPath(); cx.arc(x, 178, lit ? 7 : 5, 0, 7); cx.fill();
    }
    if (ph) {
      cx.font = "bold 16px sans-serif"; cx.textAlign = "right";
      cx.fillStyle = inResp ? "#d88a00" : "#3c8a55";
      cx.fillText(inResp ? "あなたの番" : "よく聞いて", 668, 52);
      // いま歌っている位置
      const pos = cb - (inResp ? ph.callBeat + 4 : ph.callBeat);
      if (pos >= 0 && pos < 4) {
        const x = PX + pos * STEP;
        cx.strokeStyle = inResp ? "rgba(255,179,0,.7)" : "rgba(79,174,108,.7)"; cx.lineWidth = 3;
        cx.beginPath(); cx.moveTo(x, 58); cx.lineTo(x, 160); cx.stroke();
      }
      ph.notes.forEach((n, i) => {
        if (tv < n.t) return;
        const h = ph.hits[i], x = PX + n.b * STEP, y = RY[n.key];
        const pop = Math.max(0, 1 - (tv - n.t) / 0.15);
        const bad = h.j === "miss" || h.j === "wrong";
        cx.fillStyle = bad ? "#bbb" : n.key === "R" ? "#ff8a3d" : "#4a90d9";
        cx.beginPath(); cx.arc(x, y, 15 + pop * 6, 0, 7); cx.fill();
        if (h.j && !bad) {
          cx.strokeStyle = "#ffb300"; cx.lineWidth = 4;
          cx.beginPath(); cx.arc(x, y, 21, 0, 7); cx.stroke();
        }
        if (bad) {
          cx.strokeStyle = "#fff"; cx.lineWidth = 3;
          cx.beginPath(); cx.moveTo(x - 6, y - 6); cx.lineTo(x + 6, y + 6); cx.moveTo(x + 6, y - 6); cx.lineTo(x - 6, y + 6); cx.stroke();
        }
      });
    }

    // 鳥たち
    const s = g.st;
    const teacherSing = ph && ph.notes.some(n => tv - n.t >= 0 && tv - n.t < 0.15);
    const tMood = tv - s.badAt < 0.6 ? "sad" : null;
    this.bird(250, 312 + bob, 50, "#6cc58a", "#c8ecd2", 1, teacherSing, tMood);
    const pMood = tv - s.badAt < 0.6 ? "sad" : tv - s.goodAt < 0.4 ? "happy" : null;
    this.bird(560, 312 + bob, 40, "#ffcc4d", "#fff0b8", -1, tv - s.pressAt < 0.15, pMood);

    // タップ用パッド
    for (const [key, x, label, color] of [["L", 150, "ひくい（F）", "74,144,217"], ["R", 410, "たかい（J）", "255,138,61"]]) {
      const flash = Math.max(0, 1 - (tv - s.pad[key]) / 0.15);
      cx.fillStyle = `rgba(${color},${0.18 + flash * 0.5})`;
      cx.beginPath(); cx.roundRect(x, 360, 240, 70, 18); cx.fill();
      cx.fillStyle = "#3a2a1a"; cx.font = "bold 18px sans-serif"; cx.textAlign = "center";
      cx.fillText(label, x + 120, 401);
    }
  },
};

const GAMES = [nawa, mane];

// ================= エンジン =================
let G = null;
let offsetMs = 0;
try { offsetMs = Number(localStorage.getItem("rhythm.offset") ?? localStorage.getItem("nawa.offset")) || 0; } catch (e) {}

function stopGame() {
  if (G) G.bus.disconnect();
  G = null;
}

function startGame(game) {
  ensureAudio();
  stopGame();
  const c = A.ctx;
  const bus = c.createGain(); bus.gain.value = 0.9; bus.connect(c.destination);
  const music = c.createGain(); music.gain.value = 0.4; music.connect(bus);
  const lead = c.createGain(); lead.gain.value = 0.9; lead.connect(bus);
  const sfx = c.createGain(); sfx.gain.value = 1; sfx.connect(bus);
  const g = { game, bus, music, lead, sfx, t0: c.currentTime + 0.4,
              hits: [], cues: [], endBeat: 0, empty: 0, over: false, st: {} };
  game.build(g);
  g.tEnd = g.t0 + (g.endBeat + 3) * BEAT;
  scheduleBase(g);
  game.schedule(g);
  G = g;
  hide("title"); hide("result");
}

function press(key) {
  if (!G || G.over) return;
  const now = A.ctx.currentTime;
  const tv = now - latency();
  const tIn = tv - offsetMs / 1000;
  let best = null, bd = 9;
  for (const h of G.hits) {
    if (h.t - tIn > WIN.barely) break;
    if (h.j) continue;
    const d = tIn - h.t;
    if (Math.abs(d) <= WIN.barely && Math.abs(d) < Math.abs(bd)) { best = h; bd = d; }
  }
  if (best) {
    const ad = Math.abs(bd);
    let grade = ad <= WIN.just ? "just" : ad <= WIN.ok ? "ok" : "barely";
    if (best.key && key !== best.key) grade = "wrong";
    best.j = grade;
    G.game.onJudge(G, best, grade, tv, key, now);
  } else {
    G.empty++;
    G.game.onWhiff(G, tv, key, now);
  }
}

function update() {
  if (!G || G.over) return;
  const now = A.ctx.currentTime;
  const tIn = now - latency() - offsetMs / 1000;
  for (const h of G.hits) {
    if (h.t - tIn > 0) break;
    if (!h.j && tIn - h.t > WIN.barely) {
      h.j = "miss";
      G.game.onMiss(G, h, now);
    }
  }
  if (now > G.tEnd) endGame();
}

function bestKey(game) { return `${game.id}.best`; }
function getBest(game) {
  try { return Number(localStorage.getItem(bestKey(game))) || 0; } catch (e) { return 0; }
}

function endGame() {
  G.over = true;
  const game = G.game, n = G.hits.length;
  const cnt = { just: 0, ok: 0, barely: 0, wrong: 0, miss: 0 };
  for (const h of G.hits) cnt[h.j || "miss"]++;
  const raw = (cnt.just + cnt.ok * 0.8 + cnt.barely * 0.5) / n * 100 - G.empty;
  const score = Math.max(0, Math.round(raw));
  const lv = score >= 90 ? 0 : score >= 75 ? 1 : score >= 55 ? 2 : 3;
  $("rank").textContent = ["かんぺき！", "いいかんじ", "まあまあ", "もういっかい"][lv];
  $("comment").textContent = `${game.name}　スコア ${score} 点 ― ${game.comments[lv]}`;
  const rows = [["ジャスト", cnt.just], ["OK", cnt.ok], ["ぎりぎり", cnt.barely]];
  if (game.keys === 2) rows.push(["ちがう音", cnt.wrong]);
  rows.push(["ミス", cnt.miss], ["からぶり", G.empty]);
  $("detail").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  try { if (score > getBest(game)) localStorage.setItem(bestKey(game), String(score)); } catch (e) {}
  renderStages();
  show("result");
}

function draw() {
  update();
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#fff6e0"; cx.fillRect(0, 0, cv.width, cv.height);
  if (G) {
    cx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
    G.game.draw(G, A.ctx.currentTime - latency());
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ================= UI =================
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }

function renderStages() {
  const box = $("stages");
  box.innerHTML = "";
  for (const game of GAMES) {
    const card = document.createElement("div");
    card.className = "card";
    const best = getBest(game);
    card.innerHTML = `<h3>${game.name}</h3><p>${game.desc}</p><p>操作：${game.ops}</p>
      <div class="meta"><span>${best ? `ベスト ${best} 点` : "まだ遊んでいない"}</span><button>あそぶ</button></div>`;
    card.querySelector("button").addEventListener("click", () => startGame(game));
    box.appendChild(card);
  }
}

$("offset").value = offsetMs;
$("offVal").textContent = offsetMs;
$("offset").addEventListener("input", e => {
  offsetMs = Number(e.target.value);
  $("offVal").textContent = offsetMs;
  try { localStorage.setItem("rhythm.offset", String(offsetMs)); } catch (e2) {}
});
$("retryBtn").addEventListener("click", () => startGame(G.game));
$("backBtn").addEventListener("click", () => { stopGame(); hide("result"); show("title"); });
renderStages();

const KEYS_ONE = ["Space", "Enter", "ArrowUp", "KeyZ", "KeyX", "KeyF", "KeyJ"];
const KEYS_TWO = { KeyF: "L", KeyD: "L", ArrowLeft: "L", KeyZ: "L", KeyJ: "R", KeyK: "R", ArrowRight: "R", KeyX: "R" };

addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Escape" && G) { stopGame(); hide("result"); show("title"); return; }
  if (!G || G.over) return;
  if (G.game.keys === 2) {
    if (KEYS_TWO[e.code]) { e.preventDefault(); press(KEYS_TWO[e.code]); }
  } else if (KEYS_ONE.includes(e.code)) {
    e.preventDefault(); press("A");
  }
});
addEventListener("pointerdown", e => {
  if (e.target.closest("button, input, label, .overlay")) return;
  if (!G || G.over) return;
  e.preventDefault();
  press(G.game.keys === 2 ? (e.clientX < innerWidth / 2 ? "L" : "R") : "A");
});
</script>
</body>
</html>
